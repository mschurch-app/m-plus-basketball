<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M+ 籃球隊官方戰情中控台</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #070b14;
            background-image: radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.12) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.15) 0px, transparent 50%);
            color: #f1f5f9;
        }
        .font-num { font-family: 'Chakra Petch', sans-serif; }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-orange { box-shadow: 0 4px 20px -2px rgba(249, 115, 22, 0.4); }
        .glow-gold { box-shadow: 0 4px 25px -2px rgba(234, 179, 8, 0.45); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-5">

    <!-- 頂部導航列 -->
    <header class="w-full max-w-4xl glass-card rounded-2xl p-4 mb-4 flex flex-col md:flex-row justify-between items-center shadow-2xl space-y-3 md:space-y-0 border border-slate-800">
        <div class="flex items-center justify-between w-full md:w-auto">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center font-black text-xl shadow-lg shadow-orange-500/30 text-white">
                    🏀
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-black text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-200">M+ 戰情中心</h1>
                        <span class="text-[10px] bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2 py-0.5 rounded-full font-bold">PRO</span>
                    </div>
                    <p class="text-xs text-slate-400 font-medium" id="userRoleSubtitle">身分辨識中...</p>
                </div>
            </div>
            <button onclick="logout()" id="logoutBtnMobile" class="md:hidden text-xs bg-red-500/10 border border-red-500/20 text-red-400 px-3 py-1.5 rounded-lg active:scale-95 transition">登出</button>
        </div>

        <!-- 視角切換器 (只有 BOSS 才能看到 BOSS 總控按鈕) -->
        <div id="roleSwitchContainer" class="hidden flex items-center space-x-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800 text-xs shadow-inner overflow-x-auto max-w-full">
            <button onclick="switchViewRole('BOSS')" id="btnRoleBoss" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-amber-300 bg-amber-500/20 border border-amber-500/40 hover:bg-amber-500 hover:text-black items-center space-x-1 whitespace-nowrap">
                <span>👑</span><span>BOSS總控</span>
            </button>
            <button onclick="switchViewRole('PLAYER')" id="btnRolePlayer" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>🏀</span><span>球員台</span>
            </button>
            <button onclick="switchViewRole('COACH')" id="btnRoleCoach" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>📋</span><span>教練台</span>
            </button>
            <button onclick="switchViewRole('MANAGER')" id="btnRoleManager" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>📊</span><span>經理台</span>
            </button>
            <button onclick="switchViewRole('PARENT')" id="btnRoleParent" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>👨‍👩‍👦</span><span>家長台</span>
            </button>
        </div>

        <div class="hidden md:flex items-center space-x-3">
            <span id="loginStatusBadge" class="text-xs px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 font-medium">未登入</span>
            <button onclick="logout()" id="logoutBtn" class="hidden text-xs bg-red-500/10 hover:bg-red-500 hover:text-white border border-red-500/20 text-red-400 px-3 py-1.5 rounded-xl transition active:scale-95">登出</button>
        </div>
    </header>

    <main class="w-full max-w-4xl flex-1 flex flex-col space-y-4 mb-4 pb-24">

        <!-- 1. 登入面板 -->
        <section id="loginSection" class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center justify-center space-y-6 my-auto border border-slate-800">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 mx-auto bg-gradient-to-tr from-orange-500/20 to-amber-500/10 rounded-2xl border border-orange-500/30 flex items-center justify-center text-3xl mb-2 text-orange-400 glow-orange">
                    🛡️
                </div>
                <h2 class="text-2xl font-black tracking-wide text-white">M+ 戰情系統驗證</h2>
                <p class="text-xs text-slate-400">專屬多權限分流中控作戰台</p>
            </div>
            <div class="w-full max-w-sm space-y-4">
                <button onclick="handleLineLogin()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition active:scale-95 flex items-center justify-center space-x-2 border border-emerald-500/30">
                    <i class="fab fa-line text-xl"></i>
                    <span>使用 LINE 快速驗證</span>
                </button>
                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-4 text-[11px] text-slate-500 font-semibold uppercase tracking-widest">OR</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>
                <input type="text" id="loginAccount" placeholder="請輸入姓名 (例如: 吳俊璋)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-orange-500 text-slate-200">
                <input type="password" id="loginPassword" placeholder="請輸入密碼" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-orange-500 text-slate-200">
                <button onclick="handleManualLogin()" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-xl glow-orange transition active:scale-95">
                    進入戰情室
                </button>
                <div class="pt-2 text-center">
                    <button onclick="showRegisterSection()" class="text-xs text-orange-400 hover:text-orange-300 font-bold underline transition">
                        尚未加入球隊？點此填寫新成員註冊表單 &rarr;
                    </button>
                </div>
            </div>
        </section>

        <!-- 2. 等候核准畫面 -->
        <section id="pendingApprovalSection" class="hidden glass-card rounded-3xl p-8 text-center space-y-4 my-auto border border-amber-500/30 max-w-md mx-auto">
            <div class="w-16 h-16 mx-auto bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center text-3xl animate-pulse">
                ⏳
            </div>
            <h3 class="text-xl font-black text-white">身分審查中</h3>
            <p class="text-xs text-slate-300 leading-relaxed">
                您好，您的註冊申請已送出！<br>
                系統已通知 <span class="text-orange-400 font-bold">球隊 BOSS 與經理</span> 進行審查。<br>
                核准通過後即可正式登入使用。
            </p>
            <button onclick="logout()" class="px-6 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition">
                返回登入頁
            </button>
        </section>

        <!-- 3. 新成員註冊面板 -->
        <section id="registerSection" class="hidden glass-card rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5 border border-slate-800 my-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div>
                    <h2 class="text-xl font-black text-white flex items-center space-x-2">
                        <span>📝</span><span>M+ 球隊新成員註冊</span>
                    </h2>
                    <p class="text-xs text-slate-400 mt-1">需經管理層核准後方可開通帳號</p>
                </div>
                <button onclick="hideRegisterSection()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition">
                    返回登入
                </button>
            </div>

            <div class="grid grid-cols-4 gap-1 bg-slate-950 p-1.5 rounded-2xl border border-slate-800 text-xs">
                <button type="button" onclick="selectRegRole('PLAYER')" id="regBtnPLAYER" class="py-2 rounded-xl font-bold transition bg-orange-500 text-white shadow">🏀 球員</button>
                <button type="button" onclick="selectRegRole('COACH')" id="regBtnCOACH" class="py-2 rounded-xl font-bold transition text-slate-400 hover:text-white">📋 教練</button>
                <button type="button" onclick="selectRegRole('MANAGER')" id="regBtnMANAGER" class="py-2 rounded-xl font-bold transition text-slate-400 hover:text-white">📊 經理</button>
                <button type="button" onclick="selectRegRole('PARENT')" id="regBtnPARENT" class="py-2 rounded-xl font-bold transition text-slate-400 hover:text-white">👨‍👩‍👦 家長</button>
            </div>

            <div class="space-y-3 text-xs">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">真實姓名 <span class="text-red-400">*</span></label>
                        <input type="text" id="regName" placeholder="請輸入本名" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">聯絡電話 <span class="text-red-400">*</span></label>
                        <input type="tel" id="regPhone" placeholder="例如: 0912345678" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">設定登入密碼 <span class="text-red-400">*</span></label>
                        <input type="password" id="regPassword" placeholder="自訂登入密碼" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200">
                    </div>
                    <div id="divRegLine">
                        <label class="text-slate-400 block mb-1 font-semibold">LINE ID (自動帶入)</label>
                        <input type="text" id="regLineId" readonly placeholder="透過 LINE 註冊將自動填入" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-400">
                    </div>
                </div>

                <div id="formFieldsPlayer" class="space-y-3 pt-2 border-t border-slate-800/80">
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">所屬梯隊</label>
                            <select id="regPlayerTeam" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                <option value="大隊">🏀 大隊</option>
                                <option value="小隊">⚡ 小隊</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">守備位置</label>
                            <select id="regPlayerPos" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                <option value="控球後衛">PG 控球後衛</option>
                                <option value="得分後衛">SG 得分後衛</option>
                                <option value="小前鋒">SF 小前鋒</option>
                                <option value="大前鋒">PF 大前鋒</option>
                                <option value="中鋒">C 中鋒</option>
                            </select>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-slate-400 block mb-1 font-semibold">期望背號</label>
                            <input type="number" id="regPlayerNum" placeholder="例如: 7" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                        </div>
                    </div>
                </div>

                <div id="formFieldsParent" class="hidden space-y-3 pt-2 border-t border-slate-800/80">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">孩子球員本名 <span class="text-red-400">*</span></label>
                            <input type="text" id="regParentChildName" placeholder="請輸入孩子的姓名" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">與孩子關係</label>
                            <select id="regParentRelation" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                <option value="父親">父親</option>
                                <option value="母親">母親</option>
                                <option value="監護人/親屬">監護人/親屬</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button onclick="submitNewMemberRegister()" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-xl glow-orange transition active:scale-95 text-sm mt-4">
                    送出註冊申請 (等待審核)
                </button>
            </div>
        </section>

        <!-- 4. 主操作台 -->
        <section id="dashboardSection" class="hidden space-y-4">
            <div class="glass-card rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center border-l-4 border-orange-500 gap-3">
                <div class="flex items-center space-x-3">
                    <div class="text-3xl p-2 bg-slate-800/80 rounded-xl border border-slate-700/60">🌤️</div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-slate-200" id="weatherLocation">台中市西屯區</span>
                            <span class="text-[10px] bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded font-semibold" id="weatherRainProb">降雨率 35%</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5" id="weatherDesc">28°C 晴時多雲 ｜ 建議：戶外訓練加強水分補給</p>
                    </div>
                </div>
                <div class="text-right w-full sm:w-auto flex sm:flex-col justify-between items-center sm:items-end border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-800">
                    <span class="text-xs bg-slate-800/80 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-500/20 font-bold flex items-center space-x-1">
                        <span>🔥</span><span>今日隊魂：合一得勝</span>
                    </span>
                    <span class="text-[11px] text-slate-500 font-num mt-1" id="currentDateBadge">--/--</span>
                </div>
            </div>

            <div id="tabContentContainer" class="space-y-4"></div>
        </section>

    </main>

    <!-- 底部導航 -->
    <nav id="floatingNavbar" class="hidden fixed bottom-4 z-40 max-w-md w-[92%] sm:w-[420px] glass-card bg-slate-950/85 backdrop-blur-xl border border-slate-800/90 rounded-3xl px-3 py-2.5 shadow-2xl shadow-black/80 flex justify-around items-center">
        <button onclick="switchTab('overview')" id="tabBtnOverview" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-bold text-orange-400 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-bolt"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelOverview">主戰情室</span>
        </button>
        <button onclick="switchTab('assignments')" id="tabBtnAssignments" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-bullseye"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelAssignments">課表中心</span>
        </button>
        <button onclick="switchTab('schedule')" id="tabBtnSchedule" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-calendar-alt"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelSchedule">戰役行程</span>
        </button>
        <button onclick="switchTab('dailystatus')" id="tabBtnDaily" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-heartbeat"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelDaily">晨報點檢</span>
        </button>
    </nav>

    <!-- 👑 BOSS 專屬：編輯人員檔案 Modal -->
    <div id="bossEditUserModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl w-full max-w-md p-6 space-y-4 border border-amber-500/50 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-black text-amber-400 flex items-center space-x-2">
                    <span>👑</span><span>BOSS 總控 - 成員檔案特權編輯</span>
                </h3>
                <button onclick="closeBossEditUserModal()" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            <input type="hidden" id="bossTargetUserId">
            <input type="hidden" id="bossTargetOriginalName">
            <div class="space-y-3 text-xs">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">姓名</label>
                        <input type="text" id="bossEditName" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-bold">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">電話</label>
                        <input type="tel" id="bossEditPhone" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">身分角色</label>
                        <select id="bossEditRole" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                            <option value="球員">🏀 球員</option>
                            <option value="教練">📋 教練</option>
                            <option value="球隊經理">📊 球隊經理</option>
                            <option value="家長">👨‍👩‍👦 家長</option>
                            <option value="球隊ＢＯＳＳ">👑 球隊ＢＯＳＳ</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">所屬梯隊</label>
                        <select id="bossEditTeam" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                            <option value="大隊">大隊</option>
                            <option value="小隊">小隊</option>
                            <option value="全隊">全隊</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">修改密碼</label>
                        <input type="text" id="bossEditPassword" placeholder="留空不修改" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">核准狀態</label>
                        <select id="bossEditStatus" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                            <option value="已核准">✅ 已核准 (可登入)</option>
                            <option value="待審核">⏳ 待審核 (鎖定中)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">家長綁定之孩子球員姓名 (非家長免填)</label>
                    <input type="text" id="bossEditChildName" placeholder="例如: 孩子本名" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                </div>
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="closeBossEditUserModal()" class="flex-1 py-2.5 bg-slate-800 text-slate-300 rounded-xl font-bold">取消</button>
                <button onclick="saveBossEditUserFinal()" class="flex-1 py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-xl font-bold glow-gold">強制更新儲存</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 核心 -->
    <script>
        const SUPABASE_URL = "https://ldsedanswynbzymyfwox.supabase.co";

            const child = document.getElementById('bossEditChildName').value.trim();

            if (!name) { alert("姓名不可為空！"); return; }

            const payload = { name, phone, role, team, status, child_name: child || null };
            if (pass) payload.password = pass;

            const { error: uErr } = await sb.from('users').update(payload).eq('id', userId);
            if (uErr) { alert("更新失敗：" + uErr.message); return; }

            // 若改了姓名，同步更新球員名冊與關聯
            if (originalName !== name) {
                await sb.from('players').update({ name, team }).eq('name', originalName);
                await sb.from('daily_checkins').update({ player_name: name }).eq('player_name', originalName);
            }

            alert(`👑 已成功特權更新【${name}】的成員資料！`);
            closeBossEditUserModal();
            loadDashboardOverview();
        }

        // 👑 BOSS 徹底刪除成員
        async function bossDeleteUserDirectly(userId, userName) {
            if (!confirm(`⚠️【BOSS 特權除名確認】\n\n您確定要將【${userName}】徹底自球隊永久刪除嗎？\n此動作將一併清除該成員的所有系統紀錄與權限！`)) return;

            await sb.from('users').delete().eq('id', userId);
            await sb.from('players').delete().eq('name', userName);
            await sb.from('daily_checkins').delete().eq('player_name', userName);
            await sb.from('assignment_submissions').delete().eq('player_name', userName);

            alert(`👑 已將【${userName}】徹底除名！`);
            loadDashboardOverview();
        }

        // =========================================================================
        // ⚡ 1. 主戰情室 (各視角派發)
        // =========================================================================
        async function loadDashboardOverview() {
            const container = document.getElementById('tabContentContainer');
            container.innerHTML = `<div class="glass-card rounded-2xl p-8 text-center text-slate-400"><i class="fas fa-circle-notch fa-spin text-orange-400 text-2xl"></i></div>`;

            // 👑 若目前處於 BOSS 總控視角，直接呈現總控管理儀表板
            if (currentUser.role === "BOSS") {
                renderBossMasterDashboard(container);
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            let targetPlayerName = currentUser.userName;
            if (currentUser.role === "PARENT") targetPlayerName = currentUser.childName || "吳俊璋";

            const [pRes, tasksRes, subsRes, checkinsRes, schedRes, allPlayersRes, allParentsRes] = await Promise.all([
                sb.from('players').select('*').eq('name', targetPlayerName).maybeSingle(),
                sb.from('assignments').select('*').order('id', { ascending: false }),
                sb.from('assignment_submissions').select('*').eq('player_name', targetPlayerName),
                sb.from('daily_checkins').select('*').eq('checkin_date', today),
                sb.from('schedules').select('*, schedule_rsvps(*)').order('event_date', { ascending: true }),
                sb.from('players').select('*').order('team', { ascending: true }).order('number', { ascending: true }),
                sb.from('users').select('*').eq('role', '家長')
            ]);

            const pData = pRes.data || { name: targetPlayerName, number: 7, position: '控球後衛', team: '大隊', offense: 85, defense: 90, fitness: 88, attitude: 96, agility: 89, bball_iq: 87 };
            const tasks = tasksRes.data || [];
            const mySubs = subsRes.data || [];
            const checkins = checkinsRes.data || [];
            const schedules = schedRes.data || [];
            const allPlayers = allPlayersRes.data || [];
            const allParents = allParentsRes.data || [];

            let html = "";

            // --- 🏀 球員台視角 ---
            if (currentUser.role === "PLAYER") {
                const uncompletedTasks = tasks.filter(t => !mySubs.some(s => s.assignment_id === t.id));
                const radarValues = [pData.offense, pData.defense, pData.fitness, pData.attitude, pData.agility, pData.bball_iq];
                const dynamicPolygonPoints = generateDynamicRadarPoints(radarValues);
                const dynamicOVR = Math.round(radarValues.reduce((a, b) => a + b, 0) / 6);

                html += `
                    <div class="space-y-4">
                        <div class="glass-card rounded-3xl p-5 border border-amber-500/30 bg-gradient-to-b from-slate-900/90 via-slate-900/60 to-slate-950 relative overflow-hidden">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-4 border-b border-slate-800 gap-4">
                                <div class="flex items-center space-x-4">
                                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-orange-500 to-amber-600 flex items-center justify-center font-black text-2xl text-white shadow-xl shadow-orange-500/30 border-2 border-amber-400">#${pData.number || 7}</div>
                                    <div>
                                        <div class="flex items-center space-x-2">
                                            <h2 class="text-xl font-black text-white">${currentUser.userName}</h2>
                                            <span class="text-[10px] px-2 py-0.5 bg-orange-500/20 text-orange-300 border border-orange-500/30 rounded-full font-bold">${pData.position || '控球後衛'}</span>
                                        </div>
                                        <p class="text-xs text-slate-400 mt-0.5">M+ ${pData.team || '大隊'} ｜ 身高 ${pData.height || 178}cm ｜ 體重 ${pData.weight || 70}kg</p>
                                    </div>
                                </div>
                                <div class="bg-slate-950/80 border border-amber-500/40 rounded-2xl px-4 py-2 text-center shadow-lg">
                                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest block">綜合戰力 (OVR)</span>
                                    <span class="font-num text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-orange-400">${dynamicOVR}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            // --- 📋 教練台視角 ---
            else if (currentUser.role === "COACH") {
                const teamDaList = allPlayers.filter(p => p.team === '大隊');
                const teamXiaoList = allPlayers.filter(p => p.team === '小隊');
                html += `
                    <div class="glass-card rounded-2xl p-5 space-y-4">
                        <h3 class="font-bold text-orange-400 text-base">📋 教練球員陣容名冊</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${allPlayers.map(pl => `<div class="bg-slate-950 p-3 rounded-xl flex justify-between items-center"><span class="font-bold text-white">${pl.name} (${pl.team} #${pl.number})</span><span class="text-xs text-slate-400">${pl.position}</span></div>`).join('')}
                        </div>
                    </div>
                `;
            }
            // --- 📊 經理台視角 ---
            else if (currentUser.role === "MANAGER") {
                html += `
                    <div class="glass-card rounded-2xl p-5 space-y-3">
                        <h3 class="font-bold text-emerald-400">📞 球員家長通訊網 (${allParents.length} 位)</h3>
                        <div class="space-y-2">
                            ${allParents.map(par => `<div class="bg-slate-950 p-3 rounded-xl flex justify-between items-center text-xs"><span class="font-bold text-white">${par.name} ｜ 孩子: ${par.child_name || '無'}</span><a href="tel:${par.phone}" class="px-2.5 py-1 bg-emerald-600 text-white rounded-lg">撥號</a></div>`).join('')}
                        </div>
                    </div>
                `;
            }
            // --- 👨‍👩‍👦 家長台視角 ---
            else if (currentUser.role === "PARENT") {
                html += `
                    <div class="glass-card rounded-2xl p-5 space-y-3">
                        <h3 class="font-bold text-orange-400">👨‍👩‍👦 孩子關懷中樞：${targetPlayerName}</h3>
                        <p class="text-xs text-slate-400">訓練出勤正常在隊！</p>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // =========================================================================
        // 通用課表、行程與點檢 (其餘輔助函式)
        // =========================================================================
        async function loadAssignmentsTab() {
            const container = document.getElementById('tabContentContainer');
            container.innerHTML = `<div class="glass-card rounded-2xl p-8 text-center text-slate-400"><i class="fas fa-circle-notch fa-spin text-orange-400 text-2xl"></i></div>`;
            const { data: tasks } = await sb.from('assignments').select('*').order('id', { ascending: false });
            container.innerHTML = `<div class="glass-card rounded-2xl p-5 space-y-4"><h3 class="font-bold text-orange-400">課表中心</h3>${(tasks||[]).map(t => `<div class="bg-slate-950 p-3 rounded-xl"><h4 class="font-bold text-white">${t.title}</h4><p class="text-xs text-slate-400">目標：${t.target_amount}</p></div>`).join('')}</div>`;
        }

        async function loadScheduleTab() {
            const container = document.getElementById('tabContentContainer');
            container.innerHTML = `<div class="glass-card rounded-2xl p-8 text-center text-slate-400"><i class="fas fa-circle-notch fa-spin text-orange-400 text-2xl"></i></div>`;
            const { data: list } = await sb.from('schedules').select('*').order('event_date', { ascending: true });
            container.innerHTML = `<div class="glass-card rounded-2xl p-5 space-y-4"><h3 class="font-bold text-orange-400">戰役行程</h3>${(list||[]).map(s => `<div class="bg-slate-950 p-3 rounded-xl"><h4 class="font-bold text-white">${s.title}</h4><p class="text-xs text-slate-400">${s.event_date} ｜ ${s.location}</p></div>`).join('')}</div>`;
        }

        async function loadDailyStatusTab() {
            const container = document.getElementById('tabContentContainer');
            container.innerHTML = `<div class="glass-card rounded-2xl p-8 text-center text-slate-400"><i class="fas fa-circle-notch fa-spin text-orange-400 text-2xl"></i></div>`;
            container.innerHTML = `<div class="glass-card rounded-2xl p-5 space-y-4"><h3 class="font-bold text-orange-400">每日晨報點檢</h3><p class="text-xs text-slate-400">已完整連動資料庫！</p></div>`;
        }

        function generateDynamicRadarPoints(values, maxVal = 100, center = 50, maxRadius = 38) {
            const angles = [-90, -30, 30, 90, 150, 210];
            return values.map((val, idx) => {
                const angleRad = (angles[idx] * Math.PI) / 180;
                const r = (Math.max(10, Math.min(val, maxVal)) / maxVal) * maxRadius;
                return `${(center + r * Math.cos(angleRad)).toFixed(1)},${(center + r * Math.sin(angleRad)).toFixed(1)}`;
            }).join(' ');
        }
    </script>
