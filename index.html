<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M+ 籃球隊官方戰情中控台</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <!-- 頂部導航列 -->
    <header class="w-full max-w-4xl glass-card rounded-2xl p-4 mb-4 flex flex-col md:flex-row justify-between items-center shadow-xl space-y-3 md:space-y-0">
        <div class="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-start">
            <div class="flex items-center space-x-3">
                <div class="bg-orange-500 p-2 rounded-xl text-white font-black text-xl shadow-lg">🏀</div>
                <div>
                    <h1 class="font-black text-lg tracking-wider text-orange-400">M+ 籃球隊戰情中心</h1>
                    <p class="text-xs text-slate-400" id="userRoleSubtitle">身分辨識中...</p>
                </div>
            </div>
            <button onclick="logout()" id="logoutBtnMobile" class="md:hidden text-xs bg-red-500/20 text-red-400 px-3 py-1.5 rounded-lg">登出</button>
        </div>

        <!-- 多身分視角切換器 (教練/經理/管理員登入後顯示) -->
        <div id="roleSwitchContainer" class="hidden flex items-center space-x-1 bg-slate-900/80 p-1.5 rounded-xl border border-slate-700 text-xs">
            <span class="text-slate-400 px-2 font-medium"><i class="fas fa-eye mr-1"></i>視角：</span>
            <button onclick="switchViewRole('PLAYER')" id="btnRolePlayer" class="px-3 py-1.5 rounded-lg transition font-bold text-slate-300 hover:text-white">球員台</button>
            <button onclick="switchViewRole('COACH')" id="btnRoleCoach" class="px-3 py-1.5 rounded-lg transition font-bold text-slate-300 hover:text-white">教練台</button>
            <button onclick="switchViewRole('MANAGER')" id="btnRoleManager" class="px-3 py-1.5 rounded-lg transition font-bold text-slate-300 hover:text-white">經理台</button>
        </div>

        <div class="hidden md:flex items-center space-x-2">
            <span id="loginStatusBadge" class="text-xs px-3 py-1 rounded-full bg-slate-700 text-slate-300 font-medium">未登入</span>
            <button onclick="logout()" id="logoutBtn" class="hidden text-xs bg-red-500/20 text-red-400 px-3 py-1.5 rounded-lg hover:bg-red-500 hover:text-white transition">登出</button>
        </div>
    </header>

    <!-- 主要內容區塊 -->
    <main class="w-full max-w-4xl flex-1 flex flex-col space-y-4 mb-6">

        <!-- 1. 登入畫面 (未登入時顯示) -->
        <section id="loginSection" class="glass-card rounded-3xl p-6 shadow-2xl flex flex-col items-center justify-center space-y-6 my-auto">
            <div class="text-center space-y-2">
                <div class="inline-block p-4 bg-orange-500/10 rounded-full text-orange-400 text-3xl mb-2">🛡️</div>
                <h2 class="text-2xl font-bold tracking-wide">系統安全驗證</h2>
                <p class="text-sm text-slate-400">請透過 LINE 自動登入或使用帳號密碼驗證</p>
            </div>
            <div class="w-full max-w-sm space-y-4">
                <button onclick="handleLineLogin()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center space-x-2">
                    <i class="fab fa-line text-xl"></i>
                    <span>使用 LINE 快速登入</span>
                </button>
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-700"></div>
                    <span class="flex-shrink mx-4 text-xs text-slate-500">或帳號密碼登入</span>
                    <div class="flex-grow border-t border-slate-700"></div>
                </div>
                <input type="text" id="loginAccount" placeholder="請輸入姓名 / 帳號" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500">
                <input type="password" id="loginPassword" placeholder="請輸入密碼" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500">
                <button onclick="handleManualLogin()" class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl shadow-lg transition">登入戰情系統</button>
            </div>
        </section>

        <!-- 2. 戰情總覽主面板 (登入後動態渲染) -->
        <section id="dashboardSection" class="hidden space-y-4">
            
            <!-- 天氣與快捷資訊列 -->
            <div id="weatherWidget" class="glass-card rounded-2xl p-4 flex justify-between items-center border-l-4 border-orange-500 shadow-md">
                <div class="flex items-center space-x-3">
                    <div class="text-2xl text-amber-400">🌤️</div>
                    <div>
                        <p class="text-xs text-slate-400" id="weatherLocation">台中市西屯區氣象</p>
                        <p class="text-sm font-bold text-slate-200" id="weatherDesc">載入中...</p>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-xs bg-orange-500/20 text-orange-300 px-2 py-1 rounded-md font-semibold" id="currentDateBadge">--/--</span>
                </div>
            </div>

            <!-- 動態渲染容器：依據 role 顯示對應面板 -->
            <div id="roleDashboardContainer" class="space-y-4">
                <!-- 內容由 JS 動態塞入 -->
            </div>
        </section>

    </main>

    <!-- 彈出式對話框：自主訓練成果回報 -->
    <div id="reportModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl w-full max-w-lg p-6 space-y-4 border border-slate-700 shadow-2xl relative">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-orange-400 flex items-center space-x-2">
                    <span>🏀</span>
                    <span>回報自主訓練成果</span>
                </h3>
                <button onclick="closeReportModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>
            <input type="hidden" id="modalTaskId">
            <div class="space-y-3 text-sm">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">訓練專案</label>
                    <input type="text" id="modalTaskTitle" readonly class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-slate-300">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">實際完成成果 (如: 投進100顆、耗時25分鐘)</label>
                    <input type="text" id="modalReportContent" placeholder="例如：順利完成目標，狀況良好" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 focus:border-orange-500">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">球員心得與自我檢討</label>
                    <textarea id="modalPlayerNote" rows="2" placeholder="今天投籃手感不錯..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 focus:border-orange-500"></textarea>
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">上傳訓練影片/照片檔案</label>
                    <div class="border-2 border-dashed border-slate-700 rounded-xl p-4 text-center hover:border-orange-500 transition cursor-pointer relative">
                        <input type="file" id="modalFileinput" accept="image/*,video/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="previewFileSelected(this)">
                        <p class="text-xs text-slate-400" id="fileChosenLabel">點擊或拖曳上傳訓練影片/照片 (支援手機相簿)</p>
                    </div>
                </div>
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="closeReportModal()" class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl font-medium transition">取消</button>
                <button onclick="submitTaskReportFinal()" id="submitReportBtn" class="flex-1 py-2.5 bg-orange-500 hover:bg-orange-600 font-bold rounded-xl shadow-lg transition">確認送出回報</button>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="text-center text-xs text-slate-500 py-2">
        M+ Basketball System 2.0 &copy; All Rights Reserved.
    </footer>

    <!-- JavaScript 核心邏輯 -->
    <script>
        const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxAX6z1idXFUFIRYEAj07WIManJfwOvk-P1mRLhyTn6Ewfv_ZcmhOSsT2kxqDAoxpOWFA/exec"; 

        let currentUser = {
            actualRole: null, // 原始真實身分
            role: null,      // PLAYER, COACH, MANAGER, ADMIN (目前檢視視角)
            userName: null,
            roleText: null
        };

        let selectedFileBase64 = "";
        let selectedFileName = "";

        window.addEventListener("DOMContentLoaded", () => {
            const todayStr = new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', weekday: 'short' });
            document.getElementById('currentDateBadge').innerText = todayStr;
            initializeLiff();
        });

        function initializeLiff() {
            if (typeof liff === 'undefined') { console.warn("LIFF SDK 未載入"); return; }
            liff.init({ liffId: "2011574321-QGPq8PoR" }).then(() => {
                if (liff.isLoggedIn()) {
                    const profile = liff.getDecodedIDToken();
                    if (profile && profile.sub) autoLoginWithLine(profile.sub);
                }
            }).catch(err => console.log("LIFF Init Error:", err));
        }

        async function autoLoginWithLine(lineUserId) {
            try {
                const res = await callApi("loginWithLineId", { lineUserId });
                if (res.success) setLoginSuccess(res);
            } catch (e) { console.log("自動登入失敗", e); }
        }

        async function handleLineLogin() {
            if (typeof liff !== 'undefined' && liff.isInClient()) {
                if (!liff.isLoggedIn()) { liff.login(); return; }
                const profile = liff.getDecodedIDToken();
                if (profile && profile.sub) autoLoginWithLine(profile.sub);
            } else {
                if (!liff.isLoggedIn()) { liff.login(); }
                else {
                    const profile = liff.getDecodedIDToken();
                    if (profile && profile.sub) autoLoginWithLine(profile.sub);
                }
            }
        }

        async function handleManualLogin() {
            const acc = document.getElementById('loginAccount').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            if (!acc || !pass) { alert("請輸入帳號與密碼"); return; }

            const res = await callApi("loginUser", { account: acc, password: pass });
            if (res.success) setLoginSuccess(res);
            else alert(res.message || "登入失敗");
        }

        function setLoginSuccess(res) {
            currentUser = {
                actualRole: res.role,
                role: res.role,
                userName: res.userName,
                roleText: res.roleText
            };

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('loginStatusBadge').innerText = `已登入：${currentUser.userName}`;
            document.getElementById('loginStatusBadge').className = "text-xs px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 font-medium";
            document.getElementById('logoutBtn').classList.remove('hidden');
            document.getElementById('userRoleSubtitle').innerText = `${currentUser.userName} (${currentUser.roleText})`;

            // 如果是教練、經理或 ADMIN，顯示多身分切換器
            if (["COACH", "MANAGER", "ADMIN"].includes(currentUser.actualRole)) {
                document.getElementById('roleSwitchContainer').classList.remove('hidden');
            } else {
                document.getElementById('roleSwitchContainer').classList.add('hidden');
            }

            updateRoleSwitchButtons();
            loadDashboardOverview();
        }

        function switchViewRole(targetRole) {
            currentUser.role = targetRole;
            updateRoleSwitchButtons();
            loadDashboardOverview();
        }

        function updateRoleSwitchButtons() {
            const pBtn = document.getElementById('btnRolePlayer');
            const cBtn = document.getElementById('btnRoleCoach');
            const mBtn = document.getElementById('btnRoleManager');

            [pBtn, cBtn, mBtn].forEach(b => {
                b.className = "px-3 py-1.5 rounded-lg transition font-bold text-slate-300 hover:text-white";
            });

            if (currentUser.role === "PLAYER") pBtn.className = "px-3 py-1.5 rounded-lg transition font-bold bg-orange-500 text-white shadow";
            else if (currentUser.role === "COACH" || currentUser.role === "ADMIN") cBtn.className = "px-3 py-1.5 rounded-lg transition font-bold bg-orange-500 text-white shadow";
            else if (currentUser.role === "MANAGER") mBtn.className = "px-3 py-1.5 rounded-lg transition font-bold bg-orange-500 text-white shadow";
        }

        function logout() {
            currentUser = { actualRole: null, role: null, userName: null, roleText: null };
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('roleSwitchContainer').classList.add('hidden');
            document.getElementById('loginStatusBadge').innerText = "未登入";
            document.getElementById('loginStatusBadge').className = "text-xs px-3 py-1 rounded-full bg-slate-700 text-slate-300 font-medium";
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('userRoleSubtitle').innerText = "身分辨識中...";
        }

        async function loadDashboardOverview() {
            const container = document.getElementById('roleDashboardContainer');
            container.innerHTML = `<div class="glass-card rounded-2xl p-6 text-center text-slate-400">載入【${currentUser.role === 'PLAYER' ? '球員台' : (currentUser.role === 'COACH' ? '教練台' : '經理台')}】數據中...</div>`;

            const res = await callApi("getDashboardData", { role: currentUser.role, playerName: currentUser.userName });
            if (!res.success) {
                container.innerHTML = `<div class="glass-card rounded-2xl p-6 text-center text-red-400">載入失敗: ${res.message}</div>`;
                return;
            }

            const data = res.data;
            if (data.weatherInfo) {
                document.getElementById('weatherLocation').innerText = `${data.weatherInfo.location}氣象`;
                document.getElementById('weatherDesc').innerText = `${data.weatherInfo.temperature} ｜ ${data.weatherInfo.condition} (降雨機率 ${data.weatherInfo.rainProb})`;
            }

            let html = "";

            // 1. 球員介面
            if (currentUser.role === "PLAYER") {
                const checkedStatus = data.hasCheckedInToday 
                    ? `<div class="bg-emerald-500/20 border border-emerald-500/40 p-4 rounded-xl text-emerald-300 text-sm font-medium flex items-center justify-between"><span>✅ 今日晨報已完成回報</span><span class="text-xs bg-emerald-600 text-white px-2 py-1 rounded">狀況良好</span></div>`
                    : `<div class="bg-orange-500/20 border border-orange-500/40 p-4 rounded-xl text-orange-300 text-sm font-medium flex items-center justify-between"><span>⚠️ 今日晨報尚未填寫</span><button onclick="alert('請前往晨報填寫頁面完成身心回報')" class="text-xs bg-orange-500 text-white px-3 py-1.5 rounded-lg shadow font-bold">立即填寫</button></div>`;

                html += `
                    <div class="space-y-4">
                        ${checkedStatus}
                        <div class="glass-card rounded-2xl p-5 space-y-3">
                            <h3 class="font-bold text-orange-400 flex items-center space-x-2"><span>🎯</span><span>我的專屬訓練任務</span></h3>
                            ${(data.myAssignments && data.myAssignments.length > 0) ? data.myAssignments.map(task => `
                                <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-4 space-y-2">
                                    <div class="flex justify-between items-start">
                                        <h4 class="font-bold text-slate-100">${task.title}</h4>
                                        <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">期限: ${task.deadline}</span>
                                    </div>
                                    <p class="text-xs text-slate-400">目標要求：${task.targetAmount}</p>
                                    <div class="flex justify-between items-center pt-2">
                                        <span class="text-xs text-orange-300 font-medium">狀態：${task.mySubmission ? task.mySubmission.reviewState : '尚未回報'}</span>
                                        <button onclick="openReportModal('${task.taskId}', '${task.title}')" class="px-4 py-1.5 bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold rounded-lg shadow transition">上傳回報</button>
                                    </div>
                                </div>
                            `).join('') : '<p class="text-xs text-slate-400 text-center py-4">目前尚無指派的自主訓練任務</p>'}
                        </div>
                    </div>
                `;
            }

            // 2. 教練介面
            else if (currentUser.role === "COACH" || currentUser.role === "ADMIN") {
                html += `
                    <div class="glass-card rounded-2xl p-5 space-y-3">
                        <h3 class="font-bold text-orange-400 flex items-center space-x-2"><span>📋</span><span>教練審核中心 (全隊任務與回報)</span></h3>
                        ${(data.allAssignments && data.allAssignments.length > 0) ? data.allAssignments.map(task => `
                            <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-4 space-y-2">
                                <h4 class="font-bold text-slate-100">${task.title} <span class="text-xs text-slate-400 font-normal">(${task.target})</span></h4>
                                <div class="space-y-2 pt-2">
                                    ${(task.submissions && task.submissions.length > 0) ? task.submissions.map(sub => `
                                        <div class="bg-slate-900/60 p-3 rounded-lg flex flex-col sm:flex-row justify-between items-start sm:items-center text-xs space-y-2 sm:space-y-0">
                                            <div>
                                                <p class="font-bold text-orange-300">${sub.playerName} <span class="text-slate-400 font-normal">(${sub.submittedAt})</span></p>
                                                <p class="text-slate-300 mt-1">成果：${sub.reportContent}</p>
                                                ${sub.fileUrl ? `<a href="${sub.fileUrl}" target="_blank" class="text-blue-400 underline block mt-1">🔗 檢視上傳雲端硬碟檔案</a>` : ''}
                                            </div>
                                            <button onclick="reviewSubmission(${sub.subRow}, '${sub.playerName}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold">核定通過</button>
                                        </div>
                                    `).join('') : '<p class="text-xs text-slate-500">尚無球員回報此任務</p>'}
                                </div>
                            </div>
                        `).join('') : '<p class="text-xs text-slate-400 text-center py-4">目前沒有任何任務紀錄</p>'}
                    </div>
                `;
            }

            // 3. 經理介面
            else if (currentUser.role === "MANAGER") {
                html += `
                    <div class="space-y-4">
                        <div class="glass-card rounded-2xl p-5 space-y-3">
                            <h3 class="font-bold text-orange-400 flex items-center space-x-2"><span>📊</span><span>今日全隊晨報健康狀況</span></h3>
                            ${(data.todayCheckins && data.todayCheckins.length > 0) ? data.todayCheckins.map(c => `
                                <div class="bg-slate-800/80 p-3 rounded-xl flex justify-between items-center text-xs">
                                    <div>
                                        <span class="font-bold text-slate-200">${c.name}</span>
                                        <span class="text-slate-400 ml-2">睡眠: ${c.sleep}hr ｜ 疲勞度: ${c.fatigue}/5</span>
                                    </div>
                                    <span class="text-emerald-400 font-medium">已回報</span>
                                </div>
                            `).join('') : '<p class="text-xs text-slate-400 text-center py-3">今日尚無球員填寫晨報</p>'}
                        </div>
                        <div class="glass-card rounded-2xl p-5 space-y-3">
                            <h3 class="font-bold text-orange-400 flex items-center space-x-2"><span>📢</span><span>近期球員請假通知紀錄</span></h3>
                            ${(data.recentLeaves && data.recentLeaves.length > 0) ? data.recentLeaves.map(l => `
                                <div class="bg-slate-800/80 p-3 rounded-xl text-xs space-y-1 border-l-2 border-red-500">
                                    <p class="font-bold text-red-300">${l.playerName} 請假 - ${l.eventTitle} (${l.eventDate})</p>
                                    <p class="text-slate-300">事由：${l.reason || '無'}</p>
                                </div>
                            `).join('') : '<p class="text-xs text-slate-400 text-center py-3">近期無請假紀錄</p>'}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function openReportModal(taskId, taskTitle) {
            document.getElementById('modalTaskId').value = taskId;
            document.getElementById('modalTaskTitle').value = taskTitle;
            document.getElementById('modalReportContent').value = "";
            document.getElementById('modalPlayerNote').value = "";
            document.getElementById('fileChosenLabel').innerText = "點擊或拖曳上傳訓練影片/照片";
            selectedFileBase64 = "";
            selectedFileName = "";
            document.getElementById('reportModal').classList.remove('hidden');
            document.getElementById('reportModal').classList.add('flex');
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.add('hidden');
            document.getElementById('reportModal').classList.remove('flex');
        }

        function previewFileSelected(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                selectedFileName = file.name;
                document.getElementById('fileChosenLabel').innerText = `已選擇：${file.name}`;
                const reader = new FileReader();
                reader.onload = function(e) { selectedFileBase64 = e.target.result; };
                reader.readAsDataURL(file);
            }
        }

        async function submitTaskReportFinal() {
            const taskId = document.getElementById('modalTaskId').value;
            const reportContent = document.getElementById('modalReportContent').value;
            const playerNote = document.getElementById('modalPlayerNote').value;
            const btn = document.getElementById('submitReportBtn');

            btn.innerText = "上傳檔案與送交中...";
            btn.disabled = true;

            const res = await callApi("submitAssignmentProgress", {
                taskId: taskId,
                playerName: currentUser.userName,
                reportContent: reportContent,
                playerNote: playerNote,
                fileBase64: selectedFileBase64,
                fileName: selectedFileName
            });

            btn.innerText = "確認送出回報";
            btn.disabled = false;

            if (res.success) {
                alert(res.message);
                closeReportModal();
                loadDashboardOverview();
            } else {
                alert("回報失敗: " + res.message);
            }
        }

        async function reviewSubmission(subRow, playerName) {
            const feedback = prompt(`請輸入給【${playerName}】的評語：`, "動作確實，表現優異！");
            if (feedback === null) return;

            const res = await callApi("reviewAssignment", {
                subRow: subRow,
                playerName: playerName,
                coachFeedback: feedback,
                reviewState: "✅ 審核通過 (核可)"
            });

            if (res.success) {
                alert(res.message);
                loadDashboardOverview();
            } else {
                alert("審核失敗: " + res.message);
            }
        }

        async function callApi(action, data) {
            try {
                const response = await fetch(API_ENDPOINT, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action, data })
                });
                return await response.json();
            } catch (err) {
                return { success: false, message: "網路或伺服器連線異常: " + err.toString() };
            }
        }
    </script>
</body>
</html>
