<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M+ 籃球隊官方戰情中控台 - 旗艦專業版</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #070b14;
            background-image: radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.12) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.15) 0px, transparent 50%);
            color: #f1f5f9;
        }
        .font-num { font-family: 'Chakra Petch', sans-serif; }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-orange {
            box-shadow: 0 4px 20px -2px rgba(249, 115, 22, 0.4);
        }
        .glow-gold {
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.35);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-5">

    <!-- 頂部高質感導航列 -->
    <header class="w-full max-w-4xl glass-card rounded-2xl p-4 mb-4 flex flex-col md:flex-row justify-between items-center shadow-2xl space-y-3 md:space-y-0 border border-slate-800">
        <div class="flex items-center justify-between w-full md:w-auto">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center font-black text-xl shadow-lg shadow-orange-500/30 text-white">
                    🏀
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-black text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-200">M+ 戰情中心</h1>
                        <span class="text-[10px] bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2 py-0.5 rounded-full font-bold">PRO 2.0</span>
                    </div>
                    <p class="text-xs text-slate-400 font-medium" id="userRoleSubtitle">身分辨識中...</p>
                </div>
            </div>
            <button onclick="logout()" id="logoutBtnMobile" class="md:hidden text-xs bg-red-500/10 border border-red-500/20 text-red-400 px-3 py-1.5 rounded-lg active:scale-95 transition">登出</button>
        </div>

        <!-- 頂部多身分膠囊切換器 (教練 / 經理 / BOSS 顯示) -->
        <div id="roleSwitchContainer" class="hidden flex items-center space-x-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800 text-xs shadow-inner">
            <button onclick="switchViewRole('PLAYER')" id="btnRolePlayer" class="px-3 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white flex items-center space-x-1">
                <span>🏀</span><span>球員台</span>
            </button>
            <button onclick="switchViewRole('COACH')" id="btnRoleCoach" class="px-3 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white flex items-center space-x-1">
                <span>📋</span><span>教練台</span>
            </button>
            <button onclick="switchViewRole('MANAGER')" id="btnRoleManager" class="px-3 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white flex items-center space-x-1">
                <span>📊</span><span>經理台</span>
            </button>
        </div>

        <div class="hidden md:flex items-center space-x-3">
            <span id="loginStatusBadge" class="text-xs px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 font-medium">未登入</span>
            <button onclick="logout()" id="logoutBtn" class="hidden text-xs bg-red-500/10 hover:bg-red-500 hover:text-white border border-red-500/20 text-red-400 px-3 py-1.5 rounded-xl transition active:scale-95">登出</button>
        </div>
    </header>

    <!-- 主要內容區塊 -->
    <main class="w-full max-w-4xl flex-1 flex flex-col space-y-4 mb-6">

        <!-- 1. 登入畫面 (未登入狀態) -->
        <section id="loginSection" class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center justify-center space-y-6 my-auto border border-slate-800">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 mx-auto bg-gradient-to-tr from-orange-500/20 to-amber-500/10 rounded-2xl border border-orange-500/30 flex items-center justify-center text-3xl mb-2 text-orange-400 glow-orange">
                    🛡️
                </div>
                <h2 class="text-2xl font-black tracking-wide text-white">M+ 戰情系統身分驗證</h2>
                <p class="text-xs text-slate-400 max-w-xs mx-auto">以專業數據與科學訓練武裝球隊，一鍵登入掌握專屬作戰台</p>
            </div>
            <div class="w-full max-w-sm space-y-4">
                <button onclick="handleLineLogin()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition active:scale-95 flex items-center justify-center space-x-2 border border-emerald-500/30">
                    <i class="fab fa-line text-xl"></i>
                    <span>使用 LINE 帳號自動驗證</span>
                </button>
                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-4 text-[11px] text-slate-500 uppercase tracking-widest font-semibold">OR PASSWORD</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>
                <input type="text" id="loginAccount" placeholder="請輸入姓名 / 帳號 (例如: 吳俊璋)" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 text-slate-200 transition">
                <input type="password" id="loginPassword" placeholder="請輸入密碼" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 text-slate-200 transition">
                <button onclick="handleManualLogin()" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold rounded-xl glow-orange transition active:scale-95">
                    進入專屬戰情室
                </button>
            </div>
        </section>

        <!-- 2. 戰情中控台 (登入成功後展示) -->
        <section id="dashboardSection" class="hidden space-y-4">
            
            <!-- 天氣與今日隊魂箴言 -->
            <div class="glass-card rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center border-l-4 border-orange-500 gap-3">
                <div class="flex items-center space-x-3">
                    <div class="text-3xl p-2 bg-slate-800/80 rounded-xl border border-slate-700/60">🌤️</div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-slate-200" id="weatherLocation">台中市西屯區</span>
                            <span class="text-[10px] bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded font-semibold" id="weatherRainProb">降雨率 40%</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5" id="weatherDesc">27°C 晴時多雲 ｜ 建議：戶外訓練加強水分補給</p>
                    </div>
                </div>
                <div class="text-right w-full sm:w-auto flex sm:flex-col justify-between items-center sm:items-end border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-800">
                    <span class="text-xs bg-slate-800/80 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-500/20 font-bold flex items-center space-x-1">
                        <span>🔥</span><span>今日隊魂：合一得勝</span>
                    </span>
                    <span class="text-[11px] text-slate-500 font-num mt-1" id="currentDateBadge">--/--</span>
                </div>
            </div>

            <!-- 功能分頁導航條 -->
            <div class="flex space-x-2 overflow-x-auto hide-scrollbar pb-1">
                <button onclick="switchTab('overview')" id="tabBtnOverview" class="px-4 py-2.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-xl text-xs whitespace-nowrap glow-orange flex items-center space-x-1.5 active:scale-95 transition">
                    <span>⚡</span><span>主戰情室</span>
                </button>
                <button onclick="switchTab('assignments')" id="tabBtnAssignments" class="px-4 py-2.5 bg-slate-900/80 hover:bg-slate-800 text-slate-400 font-medium rounded-xl text-xs whitespace-nowrap border border-slate-800 flex items-center space-x-1.5 active:scale-95 transition">
                    <span>🎯</span><span>課表中心</span>
                </button>
                <button onclick="switchTab('schedule')" id="tabBtnSchedule" class="px-4 py-2.5 bg-slate-900/80 hover:bg-slate-800 text-slate-400 font-medium rounded-xl text-xs whitespace-nowrap border border-slate-800 flex items-center space-x-1.5 active:scale-95 transition">
                    <span>📅</span><span>戰役行程</span>
                </button>
                <button onclick="switchTab('dailystatus')" id="tabBtnDailystatus" class="px-4 py-2.5 bg-slate-900/80 hover:bg-slate-800 text-slate-400 font-medium rounded-xl text-xs whitespace-nowrap border border-slate-800 flex items-center space-x-1.5 active:scale-95 transition">
                    <span>📋</span><span>晨報點檢</span>
                </button>
            </div>

            <!-- 動態內容渲染主容器 -->
            <div id="tabContentContainer" class="space-y-4">
                <!-- 由 JavaScript 依據角色及分頁動態注入 -->
            </div>
        </section>

    </main>

    <!-- 彈出式對話框：自主訓練成果上傳 -->
    <div id="reportModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl w-full max-w-lg p-6 space-y-4 border border-slate-700 shadow-2xl relative">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div class="flex items-center space-x-2">
                    <span class="p-2 bg-orange-500/20 text-orange-400 rounded-lg text-sm">🏀</span>
                    <h3 class="text-base font-black text-white">上傳自主訓練回報</h3>
                </div>
                <button onclick="closeReportModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">&times;</button>
            </div>
            <input type="hidden" id="modalTaskId">
            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">訓練項目</label>
                    <input type="text" id="modalTaskTitle" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-300 font-bold">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">達成數據 (例如：進球150顆、耗時30分)</label>
                    <input type="text" id="modalReportContent" placeholder="請填寫量化數據..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 focus:border-orange-500 text-slate-200">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">球員心得與自我檢討</label>
                    <textarea id="modalPlayerNote" rows="2" placeholder="今天出手弧度比平時高，手感流暢..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 focus:border-orange-500 text-slate-200"></textarea>
                </div>
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">訓練影片 / 照片 (直傳 Google Drive)</label>
                    <div class="border-2 border-dashed border-slate-800 hover:border-orange-500/60 rounded-xl p-4 text-center transition cursor-pointer relative bg-slate-950/50">
                        <input type="file" id="modalFileinput" accept="image/*,video/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="previewFileSelected(this)">
                        <div class="space-y-1">
                            <i class="fas fa-cloud-upload-alt text-2xl text-orange-400"></i>
                            <p class="text-xs text-slate-300 font-medium" id="fileChosenLabel">點擊選取或拖曳訓練檔案 (支援手機相簿)</p>
                            <p class="text-[10px] text-slate-500">檔案將自動歸檔於球隊專屬雲端硬碟資料夾</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="closeReportModal()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold transition">取消</button>
                <button onclick="submitTaskReportFinal()" id="submitReportBtn" class="flex-1 py-3 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-xl glow-orange transition active:scale-95">送出審核</button>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="text-center text-xs text-slate-600 py-2 font-mono">
        M+ Basketball Intelligence System &copy; 2026. Built with Passion.
    </footer>

    <!-- JavaScript 核心邏輯 -->
    <script>
        const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxAX6z1idXFUFIRYEAj07WIManJfwOvk-P1mRLhyTn6Ewfv_ZcmhOSsT2kxqDAoxpOWFA/exec"; 

        let currentUser = {
            actualRole: null, // 原始身分: PLAYER, COACH, MANAGER, ADMIN
            role: null,       // 目前檢視視角
            userName: null,
            roleText: null
        };

        let currentActiveTab = 'overview';
        let selectedFileBase64 = "";
        let selectedFileName = "";

        window.addEventListener("DOMContentLoaded", () => {
            const todayStr = new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', weekday: 'short' });
            document.getElementById('currentDateBadge').innerText = todayStr;
            initializeLiff();
        });

        function initializeLiff() {
            if (typeof liff === 'undefined') return;
            liff.init({ liffId: "2011574321-QGPq8PoR" }).then(() => {
                if (liff.isLoggedIn()) {
                    const profile = liff.getDecodedIDToken();
                    if (profile && profile.sub) autoLoginWithLine(profile.sub);
                }
            }).catch(err => console.log("LIFF Init Error:", err));
        }

        async function autoLoginWithLine(lineUserId) {
            try {
                const res = await callApi("loginWithLineId", { lineUserId });
                if (res.success) setLoginSuccess(res);
            } catch (e) { console.log("自動登入失敗", e); }
        }

        async function handleLineLogin() {
            if (typeof liff !== 'undefined' && liff.isInClient()) {
                if (!liff.isLoggedIn()) { liff.login(); return; }
                const profile = liff.getDecodedIDToken();
                if (profile && profile.sub) autoLoginWithLine(profile.sub);
            } else {
                if (typeof liff !== 'undefined' && !liff.isLoggedIn()) {
                    liff.login();
                } else {
                    alert("請直接在下方輸入姓名登入測試！");
                }
            }
        }

        async function handleManualLogin() {
            const acc = document.getElementById('loginAccount').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            if (!acc) { alert("請輸入姓名！"); return; }

            const res = await callApi("loginUser", { account: acc, password: pass });
            if (res.success) {
                setLoginSuccess(res);
            } else {
                alert(res.message || "登入驗證失敗");
            }
        }

        function setLoginSuccess(res) {
            currentUser = {
                actualRole: res.role,
                role: res.role,
                userName: res.userName,
                roleText: res.roleText
            };

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('loginStatusBadge').innerText = `球員/教練：${currentUser.userName}`;
            document.getElementById('loginStatusBadge').className = "text-xs px-3 py-1.5 rounded-full bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 font-bold";
            document.getElementById('logoutBtn').classList.remove('hidden');
            document.getElementById('userRoleSubtitle').innerText = `${currentUser.userName} (${currentUser.roleText})`;

            // 若為教練、經理或管理員(BOSS)，解鎖頂部多身分切換器
            if (["COACH", "MANAGER", "ADMIN"].includes(currentUser.actualRole)) {
                document.getElementById('roleSwitchContainer').classList.remove('hidden');
            } else {
                document.getElementById('roleSwitchContainer').classList.add('hidden');
            }

            updateRoleSwitchButtons();
            switchTab('overview');
        }

        function switchViewRole(targetRole) {
            currentUser.role = targetRole;
            updateRoleSwitchButtons();
            switchTab(currentActiveTab);
        }

        function updateRoleSwitchButtons() {
            const pBtn = document.getElementById('btnRolePlayer');
            const cBtn = document.getElementById('btnRoleCoach');
            const mBtn = document.getElementById('btnRoleManager');

            [pBtn, cBtn, mBtn].forEach(b => {
                b.className = "px-3 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white flex items-center space-x-1";
            });

            if (currentUser.role === "PLAYER") pBtn.className = "px-3 py-1.5 rounded-lg transition font-bold bg-orange-500 text-white shadow glow-orange flex items-center space-x-1";
            else if (currentUser.role === "COACH" || currentUser.role === "ADMIN") cBtn.className = "px-3 py-1.5 rounded-lg transition font-bold bg-orange-500 text-white shadow glow-orange flex items-center space-x-1";
            else if (currentUser.role === "MANAGER") mBtn.className = "px-3 py-1.5 rounded-lg transition font-bold bg-orange-500 text-white shadow glow-orange flex items-center space-x-1";
        }

        function logout() {
            currentUser = { actualRole: null, role: null, userName: null, roleText: null };
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('roleSwitchContainer').classList.add('hidden');
            document.getElementById('loginStatusBadge').innerText = "未登入";
            document.getElementById('loginStatusBadge').className = "text-xs px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 font-medium";
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('userRoleSubtitle').innerText = "身分辨識中...";
        }

        function switchTab(tabName) {
            currentActiveTab = tabName;
            ['overview', 'assignments', 'schedule', 'dailystatus'].forEach(t => {
                const btn = document.getElementById(`tabBtn${t.charAt(0).toUpperCase() + t.slice(1)}`);
                if (btn) {
                    btn.className = (t === tabName) 
                        ? "px-4 py-2.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-xl text-xs whitespace-nowrap glow-orange flex items-center space-x-1.5 active:scale-95 transition" 
                        : "px-4 py-2.5 bg-slate-900/80 hover:bg-slate-800 text-slate-400 font-medium rounded-xl text-xs whitespace-nowrap border border-slate-800 flex items-center space-x-1.5 active:scale-95 transition";
                }
            });

            if (tabName === 'overview') loadDashboardOverview();
            else if (tabName === 'assignments') loadAssignmentsTab();
            else if (tabName === 'schedule') loadScheduleTab();
            else if (tabName === 'dailystatus') loadDailyStatusTab();
        }

        async function loadDashboardOverview() {
            const container = document.getElementById('tabContentContainer');
            container.innerHTML = `
                <div class="glass-card rounded-2xl p-8 text-center text-slate-400 space-y-2">
                    <i class="fas fa-circle-notch fa-spin text-orange-400 text-2xl"></i>
                    <p class="text-xs">同步專屬戰情數據中...</p>
                </div>
            `;

            const res = await callApi("getDashboardData", { role: currentUser.role, playerName: currentUser.userName });
            if (!res.success) {
                container.innerHTML = `<div class="glass-card rounded-2xl p-6 text-center text-red-400">數據載入異常: ${res.message}</div>`;
                return;
            }

            const data = res.data;
            if (data.weatherInfo) {
                document.getElementById('weatherLocation').innerText = data.weatherInfo.location;
                document.getElementById('weatherRainProb').innerText = `降雨率 ${data.weatherInfo.rainProb}`;
                document.getElementById('weatherDesc').innerText = `${data.weatherInfo.temperature} ${data.weatherInfo.condition} ｜ 建議：西屯練球注意補水防曬`;
            }

            let html = "";

            // ==========================================
            // 🏀 1. 球員台：2K 動態戰力卡 + 每日任務 + 球商考驗
            // ==========================================
            if (currentUser.role === "PLAYER") {
                const checkedBanner = data.hasCheckedInToday 
                    ? `<div class="bg-emerald-500/10 border border-emerald-500/30 p-3.5 rounded-2xl text-emerald-300 text-xs font-medium flex items-center justify-between shadow-inner">
                         <div class="flex items-center space-x-2"><span>🛡️</span><span>今日晨報：已完成回報 (身心指標良好)</span></div>
                         <span class="text-[10px] bg-emerald-600/40 text-emerald-200 border border-emerald-500/40 px-2 py-0.5 rounded font-mono">READY</span>
                       </div>`
                    : `<div class="bg-orange-500/10 border border-orange-500/30 p-3.5 rounded-2xl text-orange-300 text-xs font-medium flex items-center justify-between shadow-inner">
                         <div class="flex items-center space-x-2"><span class="animate-pulse">⚠️</span><span>今日晨報：尚未填寫 (請回報疲勞與睡眠)</span></div>
                         <button onclick="switchTab('dailystatus')" class="text-xs bg-gradient-to-r from-orange-500 to-amber-500 text-white px-3 py-1.5 rounded-xl font-bold glow-orange active:scale-95 transition">立即打卡</button>
                       </div>`;

                html += `
                    <div class="space-y-4">
                        ${checkedBanner}

                        <!-- 🎴 NBA 2K 風格【球員動態戰力卡】 -->
                        <div class="glass-card rounded-3xl p-5 border border-amber-500/30 bg-gradient-to-b from-slate-900/90 via-slate-900/60 to-slate-950 glow-gold relative overflow-hidden">
                            <div class="absolute -right-8 -top-8 w-32 h-32 bg-orange-500/10 rounded-full blur-2xl pointer-events-none"></div>
                            
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-4 border-b border-slate-800 gap-4">
                                <div class="flex items-center space-x-4">
                                    <div class="relative">

                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">肌肉痠痛部位 (無請填「無」)</label>
                            <input type="text" id="dailySore" placeholder="例如：無、右大腿輕微痠痛" value="無" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">自覺疲勞度 (1-5分)</label>
                            <input type="number" id="dailyFatigue" min="1" max="5" value="2" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">備註說明</label>
                            <textarea id="dailyNote" rows="2" placeholder="其他需要向教練或防護員反映的情況..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200"></textarea>
                        </div>
                        <button onclick="submitDailyStatusForm()" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold rounded-xl glow-orange active:scale-95 transition">
                            完成並送出今日晨報
                        </button>
                    </div>
                </div>
            `;
        }

        async function submitDailyStatusForm() {
            const res = await callApi("saveDailyStatus", {
                playerName: currentUser.userName,
                team: "大隊",
                sleepHours: document.getElementById('dailySleep').value,
                energy: document.getElementById('dailyEnergy').value,
                soreArea: document.getElementById('dailySore').value,
                fatigue: document.getElementById('dailyFatigue').value,
                note: document.getElementById('dailyNote').value
            });
            if (res.success) {
                alert("🎉 " + res.message);
                switchTab('overview');
            } else {
                alert("回報失敗：" + res.message);
            }
        }

        async function submitRsvp(eventId, eventTitle, eventDate, status, reason = "") {
            const res = await callApi("submitEventRSVP", {
                eventId, eventTitle, eventDate, playerName: currentUser.userName, status, reason
            });
            alert(res.message);
            switchTab('overview');
        }

        function promptLeave(eventId, eventTitle, eventDate) {
            const reason = prompt("請輸入請假原因（將即時推播球隊經理）：", "家裡有事 / 身體不適");
            if (reason !== null) {
                submitRsvp(eventId, eventTitle, eventDate, "LEAVE", reason);
            }
        }

        function promptAssignNewTask() {
            const title = prompt("請輸入課表名稱：", "三分球定點投籃 200 顆");
            if (!title) return;
            const targetAmount = prompt("請輸入目標量要求：", "命中率達 60% 以上");
            const deadline = prompt("請輸入繳交期限：", "2026/09/20");
            
            callApi("assignTask", {
                target: "全隊",
                title: title,
                targetAmount: targetAmount || "確實完成",
                deadline: deadline || "本週內"
            }).then(res => {
                alert(res.message);
                loadDashboardOverview();
            });
        }

        function quickReview(subRow, playerName, feedback) {
            callApi("reviewAssignment", {
                subRow: subRow,
                playerName: playerName,
                coachFeedback: feedback,
                reviewState: "✅ 審核通過 (核可)"
            }).then(res => {
                alert(`已快速核准【${playerName}】的訓練回報！`);
                loadDashboardOverview();
            });
        }

        function openReportModal(taskId, taskTitle) {
            document.getElementById('modalTaskId').value = taskId;
            document.getElementById('modalTaskTitle').value = taskTitle;
            document.getElementById('modalReportContent').value = "";
            document.getElementById('modalPlayerNote').value = "";
            document.getElementById('fileChosenLabel').innerText = "點擊選取或拖曳訓練檔案 (支援手機相簿)";
            selectedFileBase64 = ""; selectedFileName = "";
            document.getElementById('reportModal').classList.remove('hidden');
            document.getElementById('reportModal').classList.add('flex');
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.add('hidden');
            document.getElementById('reportModal').classList.remove('flex');
        }

        function previewFileSelected(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                selectedFileName = file.name;
                document.getElementById('fileChosenLabel').innerText = `已選取：${file.name}`;
                const reader = new FileReader();
                reader.onload = function(e) { selectedFileBase64 = e.target.result; };
                reader.readAsDataURL(file);
            }
        }

        async function submitTaskReportFinal() {
            const taskId = document.getElementById('modalTaskId').value;
            const reportContent = document.getElementById('modalReportContent').value;
            const playerNote = document.getElementById('modalPlayerNote').value;
            const btn = document.getElementById('submitReportBtn');

            if (!reportContent) { alert("請填寫實際達成成果！"); return; }

            btn.innerText = "檔案傳輸與送審中...";
            btn.disabled = true;

            const res = await callApi("submitAssignmentProgress", {
                taskId, playerName: currentUser.userName, reportContent, playerNote,
                fileBase64: selectedFileBase64, fileName: selectedFileName
            });

            btn.innerText = "送出審核";
            btn.disabled = false;

            if (res.success) {
                alert(res.message);
                closeReportModal();
                switchTab('overview');
            } else {
                alert("送交失敗: " + res.message);
            }
        }

        async function callApi(action, data) {
            try {
                const response = await fetch(API_ENDPOINT, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action, data })
                });
                return await response.json();
            } catch (err) {
                return { success: false, message: "連線伺服器異常: " + err.toString() };
            }
        }
    </script>
</body>
</html>
