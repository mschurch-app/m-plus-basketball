<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M+ 籃球隊官方戰情中控台</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #070b14;
            background-image: radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.12) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.15) 0px, transparent 50%);
            color: #f1f5f9;
        }
        .font-num { font-family: 'Chakra Petch', sans-serif; }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-orange { box-shadow: 0 4px 20px -2px rgba(249, 115, 22, 0.4); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-5">

    <!-- 頂部導航列 -->
    <header class="w-full max-w-4xl glass-card rounded-2xl p-4 mb-4 flex flex-col md:flex-row justify-between items-center shadow-2xl space-y-3 md:space-y-0 border border-slate-800">
        <div class="flex items-center justify-between w-full md:w-auto">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center font-black text-xl shadow-lg shadow-orange-500/30 text-white">
                    🏀
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-black text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-200">M+ 戰情中心</h1>
                        <span class="text-[10px] bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2 py-0.5 rounded-full font-bold">PRO</span>
                    </div>
                    <p class="text-xs text-slate-400 font-medium" id="userRoleSubtitle">身分辨識中...</p>
                </div>
            </div>
            <button onclick="logout()" id="logoutBtnMobile" class="md:hidden text-xs bg-red-500/10 border border-red-500/20 text-red-400 px-3 py-1.5 rounded-lg active:scale-95 transition">登出</button>
        </div>

        <!-- 多身分切換器 -->
        <div id="roleSwitchContainer" class="hidden flex items-center space-x-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800 text-xs shadow-inner">
            <button onclick="switchViewRole('PLAYER')" id="btnRolePlayer" class="px-3 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white flex items-center space-x-1">
                <span>🏀</span><span>球員台</span>
            </button>
            <button onclick="switchViewRole('COACH')" id="btnRoleCoach" class="px-3 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white flex items-center space-x-1">
                <span>📋</span><span>教練台</span>
            </button>
            <button onclick="switchViewRole('MANAGER')" id="btnRoleManager" class="px-3 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white flex items-center space-x-1">
                <span>📊</span><span>經理台</span>
            </button>
        </div>

        <div class="hidden md:flex items-center space-x-3">
            <span id="loginStatusBadge" class="text-xs px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 font-medium">未登入</span>
            <button onclick="logout()" id="logoutBtn" class="hidden text-xs bg-red-500/10 hover:bg-red-500 hover:text-white border border-red-500/20 text-red-400 px-3 py-1.5 rounded-xl transition active:scale-95">登出</button>
        </div>
    </header>

    <!-- 主要內容區塊 -->
    <main class="w-full max-w-4xl flex-1 flex flex-col space-y-4 mb-4 pb-24">

        <!-- 1. 登入面板 -->
        <section id="loginSection" class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center justify-center space-y-6 my-auto border border-slate-800">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 mx-auto bg-gradient-to-tr from-orange-500/20 to-amber-500/10 rounded-2xl border border-orange-500/30 flex items-center justify-center text-3xl mb-2 text-orange-400 glow-orange">
                    🛡️
                </div>
                <h2 class="text-2xl font-black tracking-wide text-white">M+ 戰情系統驗證</h2>
                <p class="text-xs text-slate-400">專屬三權分流中控作戰台</p>
            </div>
            <div class="w-full max-w-sm space-y-4">
                <button onclick="handleLineLogin()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition active:scale-95 flex items-center justify-center space-x-2 border border-emerald-500/30">
                    <i class="fab fa-line text-xl"></i>
                    <span>使用 LINE 快速驗證</span>
                </button>
                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-4 text-[11px] text-slate-500 font-semibold uppercase tracking-widest">OR</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>
                <input type="text" id="loginAccount" placeholder="請輸入姓名 (例如: 吳俊璋)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-orange-500 text-slate-200">
                <input type="password" id="loginPassword" placeholder="請輸入密碼" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-orange-500 text-slate-200">
                <button onclick="handleManualLogin()" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-xl glow-orange transition active:scale-95">
                    進入戰情室
                </button>
                <div class="pt-2 text-center">
                    <button onclick="showRegisterSection()" class="text-xs text-orange-400 hover:text-orange-300 font-bold underline transition">
                        尚未加入球隊？點此填寫新成員註冊表單 &rarr;
                    </button>
                </div>
            </div>
        </section>

        <!-- 2. 新進人員註冊面板 -->
        <section id="registerSection" class="hidden glass-card rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5 border border-slate-800 my-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div>
                    <h2 class="text-xl font-black text-white flex items-center space-x-2">
                        <span>📝</span><span>M+ 球隊新成員註冊</span>
                    </h2>
                    <p class="text-xs text-slate-400 mt-1">請選擇您的身分並填寫專屬檔案</p>
                </div>
                <button onclick="hideRegisterSection()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition">
                    返回登入
                </button>
            </div>

            <!-- 身分切換膠囊 -->
            <div class="grid grid-cols-4 gap-1 bg-slate-950 p-1.5 rounded-2xl border border-slate-800 text-xs">
                <button type="button" onclick="selectRegRole('PLAYER')" id="regBtnPLAYER" class="py-2 rounded-xl font-bold transition bg-orange-500 text-white shadow">🏀 球員</button>
                <button type="button" onclick="selectRegRole('COACH')" id="regBtnCOACH" class="py-2 rounded-xl font-bold transition text-slate-400 hover:text-white">📋 教練</button>
                <button type="button" onclick="selectRegRole('MANAGER')" id="regBtnMANAGER" class="py-2 rounded-xl font-bold transition text-slate-400 hover:text-white">📊 經理</button>
                <button type="button" onclick="selectRegRole('PARENT')" id="regBtnPARENT" class="py-2 rounded-xl font-bold transition text-slate-400 hover:text-white">👨‍👩‍👦 家長</button>
            </div>

            <!-- 通用基本資料 -->
            <div class="space-y-3 text-xs">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">真實姓名 <span class="text-red-400">*</span></label>
                        <input type="text" id="regName" placeholder="請輸入本名" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">聯絡電話 <span class="text-red-400">*</span></label>
                        <input type="tel" id="regPhone" placeholder="例如: 0912345678" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">設定登入密碼 <span class="text-red-400">*</span></label>
                        <input type="password" id="regPassword" placeholder="自訂登入密碼" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200">
                    </div>
                    <div id="divRegLine">
                        <label class="text-slate-400 block mb-1 font-semibold">LINE ID (自動帶入)</label>
                        <input type="text" id="regLineId" readonly placeholder="透過 LINE 註冊將自動填入" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-400">
                    </div>
                </div>

                <!-- 🏀 專屬表單：球員 -->
                <div id="formFieldsPlayer" class="space-y-3 pt-2 border-t border-slate-800/80">
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">所屬梯隊</label>
                            <select id="regPlayerTeam" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                <option value="大隊">🏀 大隊</option>
                                <option value="小隊">⚡ 小隊</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">守備位置</label>
                            <select id="regPlayerPos" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                <option value="控球後衛">PG 控球後衛</option>
                                <option value="得分後衛">SG 得分後衛</option>
                                <option value="小前鋒">SF 小前鋒</option>
                                <option value="大前鋒">PF 大前鋒</option>
                                <option value="中鋒">C 中鋒</option>
                            </select>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-slate-400 block mb-1 font-semibold">期望背號</label>
                            <input type="number" id="regPlayerNum" placeholder="例如: 7" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">身高 (cm)</label>
                            <input type="number" id="regPlayerHeight" placeholder="例如: 178" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">體重 (kg)</label>
                            <input type="number" id="regPlayerWeight" placeholder="例如: 70" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">緊急聯絡人 (家長姓名)</label>
                            <input type="text" id="regPlayerEmergencyName" placeholder="例如: 爸爸姓名" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">緊急聯絡電話</label>
                            <input type="tel" id="regPlayerEmergencyPhone" placeholder="例如: 0988xxxxxx" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                        </div>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">既往傷病史 (無請填無)</label>
                        <input type="text" id="regPlayerInjury" value="無" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                </div>

                <!-- 📋 專屬表單：教練 -->
                <div id="formFieldsCoach" class="hidden space-y-3 pt-2 border-t border-slate-800/80">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">主要執教梯隊</label>
                            <select id="regCoachTeam" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                <option value="大隊">🏀 大隊</option>
                                <option value="小隊">⚡ 小隊</option>
                                <option value="全隊">🔥 全隊總協同</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">執教職位</label>
                            <select id="regCoachPosition" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                <option value="總教練">總教練</option>
                                <option value="助理教練">助理教練</option>
                                <option value="體能訓練師">體能訓練師</option>
                                <option value="技術教練">技術教練</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 📊 專屬表單：球隊經理 -->
                <div id="formFieldsManager" class="hidden space-y-3 pt-2 border-t border-slate-800/80">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">主要負責梯隊</label>
                            <select id="regManagerTeam" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                <option value="大隊">🏀 大隊</option>
                                <option value="小隊">⚡ 小隊</option>
                                <option value="全隊">全隊綜合行政</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">負責範疇</label>
                            <select id="regManagerDuty" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                <option value="全隊出勤與點檢">全隊出勤與點檢</option>
                                <option value="裝備物資採購">裝備物資採購</option>
                                <option value="賽事紀錄與影像">賽事紀錄與影像</option>
                                <option value="綜合後勤">綜合後勤</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 👨‍👩‍👦 專屬表單：家長 -->
                <div id="formFieldsParent" class="hidden space-y-3 pt-2 border-t border-slate-800/80">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">孩子球員本名 <span class="text-red-400">*</span></label>
                            <input type="text" id="regParentChildName" placeholder="例如: 孩子姓名" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">與孩子關係</label>
                            <select id="regParentRelation" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                <option value="父親">父親</option>
                                <option value="母親">母親</option>
                                <option value="監護人/親屬">監護人/親屬</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1 font-semibold">孩子所屬梯隊</label>
                            <select id="regParentTeam" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                <option value="大隊">🏀 大隊</option>
                                <option value="小隊">⚡ 小隊</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button onclick="submitNewMemberRegister()" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-xl glow-orange transition active:scale-95 text-sm mt-4">
                    確認送出註冊並進入戰情台
                </button>
            </div>
        </section>

        <!-- 3. 主操作台 -->
        <section id="dashboardSection" class="hidden space-y-4">
            <div class="glass-card rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center border-l-4 border-orange-500 gap-3">
                <div class="flex items-center space-x-3">
                    <div class="text-3xl p-2 bg-slate-800/80 rounded-xl border border-slate-700/60">🌤️</div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-slate-200" id="weatherLocation">台中市西屯區</span>
                            <span class="text-[10px] bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded font-semibold" id="weatherRainProb">降雨率 35%</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5" id="weatherDesc">28°C 晴時多雲 ｜ 建議：戶外訓練加強水分補給</p>
                    </div>
                </div>
                <div class="text-right w-full sm:w-auto flex sm:flex-col justify-between items-center sm:items-end border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-800">
                    <span class="text-xs bg-slate-800/80 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-500/20 font-bold flex items-center space-x-1">
                        <span>🔥</span><span>今日隊魂：合一得勝</span>
                    </span>
                    <span class="text-[11px] text-slate-500 font-num mt-1" id="currentDateBadge">--/--</span>
                </div>
            </div>

            <!-- 動態內容注入區塊 -->
            <div id="tabContentContainer" class="space-y-4"></div>
        </section>

    </main>

    <!-- 📱 底部現代毛玻璃浮動導航列 -->
    <nav id="floatingNavbar" class="hidden fixed bottom-4 z-40 max-w-md w-[92%] sm:w-[420px] glass-card bg-slate-950/85 backdrop-blur-xl border border-slate-800/90 rounded-3xl px-3 py-2.5 shadow-2xl shadow-black/80 flex justify-around items-center">
        <button onclick="switchTab('overview')" id="tabBtnOverview" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-bold text-orange-400 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-bolt"></i></span>
            <span class="text-[10px] tracking-wider">主戰情室</span>
        </button>
        <button onclick="switchTab('assignments')" id="tabBtnAssignments" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-bullseye"></i></span>
            <span class="text-[10px] tracking-wider">課表中心</span>
        </button>
        <button onclick="switchTab('schedule')" id="tabBtnSchedule" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-calendar-alt"></i></span>
            <span class="text-[10px] tracking-wider">戰役行程</span>
        </button>
        <button onclick="switchTab('dailystatus')" id="tabBtnDailystatus" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-heartbeat"></i></span>
            <span class="text-[10px] tracking-wider">晨報點檢</span>
        </button>
    </nav>

    <!-- 彈出對話框：自主訓練回報 -->
    <div id="reportModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl w-full max-w-lg p-6 space-y-4 border border-slate-700 shadow-2xl relative">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div class="flex items-center space-x-2">
                    <span class="p-2 bg-orange-500/20 text-orange-400 rounded-lg text-sm">🏀</span>
                    <h3 class="text-base font-black text-white">上傳自主訓練回報</h3>
                </div>
                <button onclick="closeReportModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">&times;</button>
            </div>
            <input type="hidden" id="modalTaskId">
            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">訓練項目</label>
                    <input type="text" id="modalTaskTitle" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-300 font-bold">
                </div>

        function generateDynamicRadarPoints(values, maxVal = 100, center = 50, maxRadius = 38) {
            const angles = [-90, -30, 30, 90, 150, 210];
            const points = values.map((val, idx) => {
                const angleRad = (angles[idx] * Math.PI) / 180;
                const r = (Math.max(10, Math.min(val, maxVal)) / maxVal) * maxRadius;
                const x = (center + r * Math.cos(angleRad)).toFixed(1);
                const y = (center + r * Math.sin(angleRad)).toFixed(1);
                return `${x},${y}`;
            });
            return points.join(' ');
        }

                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                                ${["⚡ 精神飽滿", "👌 普通正常", "🥱 稍微疲憊", "⚠️ 極度疲憊"].map(e => `
                                    <button type="button" onclick="selectEnergy('${e}')" class="energy-btn py-2.5 rounded-xl border border-slate-800 bg-slate-900 text-slate-300 font-medium transition ${e.indexOf('飽滿') !== -1 ? 'border-orange-500 bg-orange-500/20 text-orange-400' : ''}" data-val="${e}">${e}</button>
                                `).join('')}
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-xs text-slate-400 font-semibold block">痠痛或緊繃部位 (可多選)：</label>
                            <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 text-xs">
                                ${["無", "雙腿緊繃", "右腳踝", "左腳踝", "腰部痠痛", "右肩", "左膝", "右膝", "背部緊繃"].map(s => `
                                    <button type="button" onclick="toggleSore(this, '${s}')" class="sore-btn py-2 rounded-xl border border-slate-800 bg-slate-900 text-slate-300 transition ${s === '無' ? 'border-emerald-500 bg-emerald-500/20 text-emerald-400' : ''}" data-val="${s}">${s}</button>
                                `).join('')}
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-xs text-slate-400 font-semibold block">自覺疲勞指數 (1分最輕鬆，5分極累)：</label>
                            <div class="grid grid-cols-5 gap-2 text-xs">
                                ${[1, 2, 3, 4, 5].map(f => `
                                    <button type="button" onclick="selectFatigue(${f})" class="fatigue-btn py-2.5 rounded-xl border border-slate-800 bg-slate-900 text-slate-300 font-bold transition ${f === 2 ? 'border-orange-500 bg-orange-500/20 text-orange-400' : ''}" data-val="${f}">${f} 分</button>
                                `).join('')}
                            </div>
                        </div>

                        <div class="space-y-1">
                            <label class="text-xs text-slate-400 font-semibold block">其他備註說明：</label>
                            <textarea id="dailyNote" rows="2" placeholder="例如：昨晚略有失眠，需加強小腿熱敷..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-200 focus:border-orange-500"></textarea>
                        </div>

                        <button onclick="submitRefinedDailyStatus()" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-xl glow-orange active:scale-95 transition">
                            完成並送出晨報點檢
                        </button>
                    </div>
                `;
            }
        }

        function selectSleep(h) {
            morningSleep = h;
            document.getElementById('labelSleep').innerText = h;
            document.querySelectorAll('.sleep-btn').forEach(b => {
                b.className = b.dataset.val == h 
                    ? "sleep-btn py-2 rounded-xl border border-orange-500 bg-orange-500/20 text-orange-400 font-bold transition"
                    : "sleep-btn py-2 rounded-xl border border-slate-800 bg-slate-900 text-slate-300 font-bold transition";
            });
        }

        function selectEnergy(e) {
            morningEnergy = e;
            document.querySelectorAll('.energy-btn').forEach(b => {
                b.className = b.dataset.val === e 
                    ? "energy-btn py-2.5 rounded-xl border border-orange-500 bg-orange-500/20 text-orange-400 font-medium transition"
                    : "energy-btn py-2.5 rounded-xl border border-slate-800 bg-slate-900 text-slate-300 font-medium transition";
            });
        }

        function toggleSore(btn, s) {
            if (s === "無") {
                morningSores = ["無"];
                document.querySelectorAll('.sore-btn').forEach(b => {
                    b.className = (b.dataset.val === "無") 
                        ? "sore-btn py-2 rounded-xl border border-emerald-500 bg-emerald-500/20 text-emerald-400 transition"
                        : "sore-btn py-2 rounded-xl border border-slate-800 bg-slate-900 text-slate-300 transition";
                });
                return;
            }

            morningSores = morningSores.filter(x => x !== "無");
            document.querySelector('.sore-btn[data-val="無"]').className = "sore-btn py-2 rounded-xl border border-slate-800 bg-slate-900 text-slate-300 transition";

            if (morningSores.includes(s)) {
                morningSores = morningSores.filter(x => x !== s);
                btn.className = "sore-btn py-2 rounded-xl border border-slate-800 bg-slate-900 text-slate-300 transition";
            } else {
                morningSores.push(s);
                btn.className = "sore-btn py-2 rounded-xl border border-orange-500 bg-orange-500/20 text-orange-400 font-bold transition";
            }

            if (morningSores.length === 0) {
                morningSores = ["無"];
                document.querySelector('.sore-btn[data-val="無"]').className = "sore-btn py-2 rounded-xl border border-emerald-500 bg-emerald-500/20 text-emerald-400 transition";
            }
        }

        function selectFatigue(f) {
            morningFatigue = f;
            document.querySelectorAll('.fatigue-btn').forEach(b => {
                b.className = b.dataset.val == f 
                    ? "fatigue-btn py-2.5 rounded-xl border border-orange-500 bg-orange-500/20 text-orange-400 font-bold transition"
                    : "fatigue-btn py-2.5 rounded-xl border border-slate-800 bg-slate-900 text-slate-300 font-bold transition";
            });
        }

        async function submitRefinedDailyStatus() {
            const today = new Date().toISOString().split('T')[0];
            const { error } = await sb.from('daily_checkins').insert([{
                player_name: currentUser.userName,
                team: "大隊",
                sleep_hours: morningSleep,
                energy: morningEnergy,
                sore_area: morningSores.join('、'),
                fatigue: morningFatigue,
                note: document.getElementById('dailyNote').value,
                checkin_date: today
            }]);

            if (error) alert("送出失敗: " + error.message);
            else {
                alert("🎉 晨報點檢完成！");
                switchTab('overview');
            }
        }

        async function sendDailyAdvice(checkinId) {
            const adviceInput = document.getElementById(`advice_${checkinId}`);
            const advice = adviceInput.value.trim();
            if (!advice) { alert("請填寫建議！"); return; }

            const { error } = await sb.from('daily_checkins').update({ advice }).eq('id', checkinId);
            if (!error) alert("已成功送達指導建議！");
        }

        // =========================================================================
        // 行程管理、課表回報
        // =========================================================================
        function openEventModal() {
            document.getElementById('eventModal').classList.remove('hidden');
            document.getElementById('eventModal').classList.add('flex');
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.add('hidden');
            document.getElementById('eventModal').classList.remove('flex');
        }

        async function saveScheduleEventFinal() {
            const date = document.getElementById('evDate').value;
            const time = document.getElementById('evTime').value;
            const type = document.getElementById('evType').value;
            const title = document.getElementById('evTitle').value;
            const location = document.getElementById('evLocation').value;

            if (!date || !title) { alert("請填寫活動日期與標題！"); return; }

            const { error } = await sb.from('schedules').insert([{
                event_date: date, event_time: time, event_type: type, title, location
            }]);

            if (!error) {
                alert("🎉 戰役行程發布成功！");
                closeEventModal();
                loadScheduleTab();
            }
        }

        async function deleteScheduleEvent(id) {
            if (!confirm("確定要刪除此戰役行程嗎？")) return;
            const { error } = await sb.from('schedules').delete().eq('id', id);
            if (!error) loadScheduleTab();
        }

        async function submitRsvp(scheduleId, status, reason = "") {
            const { error } = await sb.from('schedule_rsvps').upsert([{
                schedule_id: scheduleId,
                player_name: currentUser.userName,
                status: status,
                reason: reason
            }]);
            if (!error) {
                alert("狀態已登記！");
                loadScheduleTab();
            }
        }

        function promptLeave(scheduleId) {
            const reason = prompt("請輸入請假事由：", "個人事由");
            if (reason !== null) submitRsvp(scheduleId, "請假", reason);
        }

        async function promptAssignNewTask() {
            const title = prompt("請輸入課表名稱：", "外線定點投籃 200 顆");
            if (!title) return;
            const targetAmount = prompt("請輸入目標量要求：", "命中率 60% 以上");
            const deadline = prompt("請輸入繳交期限：", "本週末");

            const { error } = await sb.from('assignments').insert([{
                title, target_amount: targetAmount, deadline, target_role: "全隊"
            }]);

            if (!error) {
                alert("課表發布成功！");
                loadAssignmentsTab();
            }
        }

        async function quickReview(submissionId, playerName, feedback) {
            const { error } = await sb.from('assignment_submissions').update({
                coach_feedback: feedback,
                review_state: "✅ 審核通過 (核可)"
            }).eq('id', submissionId);

            if (!error) {
                alert(`已快速核准【${playerName}】！`);
                loadAssignmentsTab();
            }
        }

        function openReportModal(taskId, taskTitle) {
            document.getElementById('modalTaskId').value = taskId;
            document.getElementById('modalTaskTitle').value = taskTitle;
            document.getElementById('modalReportContent').value = "";
            document.getElementById('modalPlayerNote').value = "";
            document.getElementById('reportModal').classList.remove('hidden');
            document.getElementById('reportModal').classList.add('flex');
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.add('hidden');
            document.getElementById('reportModal').classList.remove('flex');
        }

        async function submitTaskReportFinal() {
            const taskId = document.getElementById('modalTaskId').value;
            const reportContent = document.getElementById('modalReportContent').value;
            const playerNote = document.getElementById('modalPlayerNote').value;

            if (!reportContent) { alert("請填寫達成成果！"); return; }

            const { error } = await sb.from('assignment_submissions').insert([{
                assignment_id: taskId,
                player_name: currentUser.userName,
                report_content: reportContent,
                player_note: playerNote,
                review_state: "待審核"
            }]);

            if (!error) {
                alert("🎉 回報成果已送達教練台！");
                closeReportModal();
                loadAssignmentsTab();
            }
        }
    </script>
</body>
</html>
