<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ｍ＋藍球隊球員系統</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #05070d;
            background-image: radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.15) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.18) 0px, transparent 50%);
            color: #f1f5f9;
        }
        .font-num { font-family: 'Chakra Petch', sans-serif; }
        .glass-card {
            background: rgba(13, 19, 33, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-orange { box-shadow: 0 4px 25px -2px rgba(249, 115, 22, 0.45); }
        .glow-gold { box-shadow: 0 6px 30px -3px rgba(234, 179, 8, 0.55); }
        .card-2k-border {
            border: 1.5px solid transparent;
            background: linear-gradient(rgba(15, 23, 42, 0.94), rgba(11, 15, 25, 0.98)) padding-box,
                        linear-gradient(135deg, #f59e0b, #ea580c, #475569) border-box;
        }
        .radar-mesh { stroke: rgba(255, 255, 255, 0.12); stroke-dasharray: 2 2; }
        
        /* 戰術板專用球場樣式 */
        .court-board {
            position: relative;
            background: #111827;
            border: 2px solid #f97316;
            touch-action: none;
            user-select: none;
        }
        .tactical-piece {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: grab;
            touch-action: none;
        }
        .tactical-piece:active { cursor: grabbing; scale: 1.15; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-5">

    <!-- 頂部導航列 -->
    <header class="w-full max-w-4xl glass-card rounded-2xl p-4 mb-4 flex flex-col md:flex-row justify-between items-center shadow-2xl space-y-3 md:space-y-0 border border-slate-800">
        <div class="flex items-center justify-between w-full md:w-auto">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center font-black text-xl shadow-lg shadow-orange-500/30 text-white">
                    🏀
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-black text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-200">Ｍ＋藍球隊球員系統</h1>
                        <span class="text-[10px] bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2 py-0.5 rounded-full font-bold">PRO</span>
                    </div>
                    <p class="text-xs text-slate-400 font-medium" id="userRoleSubtitle">身分辨識中...</p>
                </div>
            </div>
            <button onclick="logout()" id="logoutBtnMobile" class="md:hidden text-xs bg-red-500/10 border border-red-500/20 text-red-400 px-3 py-1.5 rounded-lg active:scale-95 transition">登出</button>
        </div>

        <!-- 多身分切換器 -->
        <div id="roleSwitchContainer" class="hidden flex items-center space-x-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800 text-xs shadow-inner overflow-x-auto max-w-full">
            <button onclick="switchViewRole('BOSS')" id="btnRoleBoss" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-amber-300 bg-amber-500/20 border border-amber-500/40 hover:bg-amber-500 hover:text-black items-center space-x-1 whitespace-nowrap">
                <span>👑</span><span>BOSS總控</span>
            </button>
            <button onclick="switchViewRole('PLAYER')" id="btnRolePlayer" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>🏀</span><span>球員台</span>
            </button>
            <button onclick="switchViewRole('COACH')" id="btnRoleCoach" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>📋</span><span>教練台</span>

            <button onclick="switchViewRole('MANAGER')" id="btnRoleManager" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>📊</span><span>經理台</span>

                <span>👨‍👩‍👦</span><span>家長台</span>

        <div class="hidden md:flex items-center space-x-3">

            <button onclick="logout()" id="logoutBtn" class="hidden text-xs bg-red-500/10 hover:bg-red-500 hover:text-white border border-red-500/20 text-red-400 px-3 py-1.5 rounded-xl transition active:scale-95">登出</button>
        </div>
    </header>

    <main class="w-full max-w-4xl flex-1 flex flex-col space-y-4 mb-4 pb-24">

        <!-- 1. 登入面板 -->

            <div class="text-center space-y-2">

                <input type="text" id="loginAccount" placeholder="請輸入姓名 (例如: 吳俊璋)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-orange-500 text-slate-200">
                <input type="password" id="loginPassword" placeholder="請輸入密碼" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-orange-500 text-slate-200">
                <button onclick="handleManualLogin()" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-xl glow-orange transition active:scale-95">
                    進入系統

        <!-- 2. 主操作台 -->
        <section id="dashboardSection" class="hidden space-y-4">

                    <span class="text-xs bg-slate-800/80 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-500/20 font-bold flex items-center space-x-1">
                        <span>🔥</span><span>今日隊魂：合一得勝</span>

            <div id="tabContentContainer" class="space-y-4"></div>

    </main>

    <!-- 底部現代毛玻璃浮動導航列 -->
    <nav id="floatingNavbar" class="hidden fixed bottom-4 z-40 max-w-md w-[92%] sm:w-[420px] glass-card bg-slate-950/85 backdrop-blur-xl border border-slate-800/90 rounded-3xl px-3 py-2.5 shadow-2xl shadow-black/80 flex justify-around items-center">
        <button onclick="switchTab('overview')" id="tabBtnOverview" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-bold text-orange-400 transition active:scale-90">

        <!-- 戰術戰略分頁對全體身分開放 -->

            <span class="text-lg mb-0.5"><i class="fas fa-chess-board"></i></span>
            <span class="text-[10px] tracking-wider">戰術戰略</span>
        </button>
        <button onclick="switchTab('assignments')" id="tabBtnAssignments" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-bullseye"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelAssignments">課表中心</span>
        </button>
        <button onclick="switchTab('schedule')" id="tabBtnSchedule" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-calendar-alt"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelSchedule">戰役行程</span>
        </button>
        <button onclick="switchTab('dailystatus')" id="tabBtnDaily" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-heartbeat"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelDaily">晨報點檢</span>
        </button>
    </nav>

    <!-- 📋 現場即時點名名冊 Modal -->
    <div id="attendanceModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl w-full max-w-lg p-6 space-y-4 border border-emerald-500/40 shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 flex-shrink-0">
                <div>
                    <h3 class="text-base font-black text-emerald-400 flex items-center space-x-2">
                        <span>📋</span><span id="attModalTitle">戰役現場點名</span>

                    <p class="text-[11px] text-slate-400 mt-0.5">點擊直接標記出席、請假或未到</p>

                <button onclick="closeAttendanceModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>
            <div id="attendanceRosterList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
            <div class="pt-2 border-t border-slate-800 flex justify-end flex-shrink-0">
                <button onclick="closeAttendanceModal()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold transition">完成點名關閉</button>
            </div>
        </div>
    </div>

    <!-- 👤 編輯球員卡檔案 Modal -->
    <div id="playerProfileModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl w-full max-w-md p-6 space-y-4 border border-amber-500/40 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-black text-white flex items-center space-x-2">
                    <span class="text-orange-400">⚡</span><span>編輯球員卡檔案與照片</span>
                </h3>
                <button onclick="closePlayerProfileModal()" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            <div class="space-y-4 text-xs">
                <div class="flex items-center space-x-4 bg-slate-950 p-3 rounded-2xl border border-slate-800">
                    <div id="playerAvatarPreview" class="w-20 h-20 rounded-2xl bg-slate-900 border-2 border-orange-500/80 overflow-hidden flex items-center justify-center shadow-lg">
                        <span class="font-num text-2xl font-black text-slate-500">#--</span>
                    </div>
                    <div class="flex-1 space-y-2">
                        <label class="text-slate-300 font-bold block">球員照更換 (支援拍照/選圖)</label>
                        <input type="file" id="playerPhotoInput" accept="image/*" onchange="previewAndCompressImage(this, 'playerAvatarPreview', 'hiddenPlayerPhotoBase64')" class="text-[11px] text-slate-400 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:bg-orange-500/20 file:text-orange-400 file:font-bold">
                        <input type="hidden" id="hiddenPlayerPhotoBase64">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">守備位置</label>
                        <select id="editPlayerPos" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                            <option value="控球後衛">PG 控球後衛</option>
                            <option value="得分後衛">SG 得分後衛</option>
                            <option value="小前鋒">SF 小前鋒</option>
                            <option value="大前鋒">PF 大前鋒</option>
                            <option value="中鋒">C 中鋒</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">球衣背號</label>
                        <input type="number" id="editPlayerNum" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">身高 (cm)</label>
                        <input type="number" id="editPlayerHeight" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">體重 (kg)</label>
                        <input type="number" id="editPlayerWeight" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                </div>
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="closePlayerProfileModal()" class="flex-1 py-2.5 bg-slate-800 text-slate-300 rounded-xl font-bold">取消</button>
                <button onclick="savePlayerProfileFinal()" class="flex-1 py-2.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white rounded-xl font-bold glow-orange">確認更新球員卡</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 核心 -->
    <script>
        const SUPABASE_URL = "https://ldsedanswynbzymyfwox.supabase.co";
        const SUPABASE_KEY = "sb_publishable_M1akQ21ePT5OVjpjO1kc8A_2GqObjrT";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const BOSS_LINE_ID = "Ub1bd5e82e545ebb5833585d8381d2eee";
        const LINE_ACCESS_TOKEN = "9TA4Y8iCrq09SBogXiif2nasB3b1RJQek441XQSC4o1vCGRqbCrbFL46Gdrf4eHcJi0/fWJZD4ktNjiW9tlmEcv0oFzeko326iAJm7tLTic8D/64r6Y0LkChXseAl0B0zoY7Rh3Lk9M7XXBO+XBnnQdB04t89/1O/w1cDnyilFU=";

        let currentUser = { actualRole: null, role: null, userName: null, roleText: null, childName: null, status: null };
        let currentActiveTab = 'overview';
        let activeAttendanceScheduleId = null;
        let bossSelectedFilterRole = 'ALL';

        let defaultTacticPieces = [
            { id: "O1", label: "PG", type: "offense", x: 50, y: 78 },
            { id: "O2", label: "SG", type: "offense", x: 20, y: 65 },
            { id: "O3", label: "SF", type: "offense", x: 80, y: 65 },
            { id: "O4", label: "PF", type: "offense", x: 30, y: 35 },
            { id: "O5", label: "C",  type: "offense", x: 70, y: 35 },
            { id: "D1", label: "X1", type: "defense", x: 50, y: 68 },
            { id: "D2", label: "X2", type: "defense", x: 25, y: 55 },
            { id: "D3", label: "X3", type: "defense", x: 75, y: 55 },
            { id: "D4", label: "X4", type: "defense", x: 35, y: 28 },
            { id: "D5", label: "X5", type: "defense", x: 65, y: 28 },
            { id: "BALL", label: "🏀", type: "ball", x: 50, y: 84 }
        ];
        let currentTacticPieces = JSON.parse(JSON.stringify(defaultTacticPieces));

        window.addEventListener("DOMContentLoaded", () => {
            const todayStr = new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', weekday: 'short' });
            document.getElementById('currentDateBadge').innerText = todayStr;
            initializeLiff();
        });

        function initializeLiff() {
            if (typeof liff === 'undefined') return;
            liff.init({ liffId: "2011574321-QGPq8PoR" }).then(() => {
                if (liff.isLoggedIn()) {
                    const profile = liff.getDecodedIDToken();
                    if (profile && profile.sub) autoLoginWithLine(profile.sub, profile.name);
                }
            }).catch(err => console.log("LIFF Error:", err));
        }

        async function autoLoginWithLine(lineUserId, lineName = "") {
            try {
                const { data } = await sb.from('users').select('*').eq('line_id', lineUserId).maybeSingle();
                if (data) processLoginSuccess(data);
            } catch (e) { console.log(e); }
        }

        async function handleLineLogin() {
            if (typeof liff !== 'undefined' && liff.isInClient()) {
                if (!liff.isLoggedIn()) { liff.login(); return; }
                const profile = liff.getDecodedIDToken();
                if (profile && profile.sub) autoLoginWithLine(profile.sub, profile.name);
            } else {
                alert("請直接在下方輸入姓名登入測試！");
            }
        }

        async function handleManualLogin() {
            const acc = document.getElementById('loginAccount').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            if (!acc) { alert("請輸入姓名！"); return; }

            const { data, error } = await sb.from('users').select('*').eq('name', acc).maybeSingle();
            if (error) { alert("連線異常：" + error.message); return; }

            if (!data) {
                alert(`查無【${acc}】的資料！`);
            } else {
                if (data.password && pass && data.password !== pass) {
                    alert("密碼不正確！");
                    return;
                }
                processLoginSuccess(data);
            }
        }

        function processLoginSuccess(userRecord) {
            const isBoss = userRecord.name === "吳俊璋" || userRecord.role.indexOf("BOSS") !== -1;
            let roleCode = "PLAYER";
            if (userRecord.role === "教練") roleCode = "COACH";
            if (userRecord.role === "球隊經理") roleCode = "MANAGER";
            if (userRecord.role === "家長") roleCode = "PARENT";
            if (isBoss) roleCode = "BOSS";

            currentUser = {
                actualRole: roleCode,
                role: roleCode,
                userName: userRecord.name,
                roleText: userRecord.role,
                childName: userRecord.child_name || null,
                status: userRecord.status
            };

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('floatingNavbar').classList.remove('hidden');
            document.getElementById('loginStatusBadge').innerText = `${currentUser.userName} (${currentUser.roleText})`;
            document.getElementById('loginStatusBadge').className = "text-xs px-3 py-1.5 rounded-full bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 font-bold";
            document.getElementById('logoutBtn').classList.remove('hidden');
            document.getElementById('userRoleSubtitle').innerText = `${currentUser.userName} (${currentUser.roleText})`;

            setupRoleSwitchPermissions(currentUser.actualRole);
            updateRoleSwitchButtons();
            switchTab('overview');
        }

        function setupRoleSwitchPermissions(actualRole) {
            const container = document.getElementById('roleSwitchContainer');
            const bossBtn = document.getElementById('btnRoleBoss');
            const pBtn = document.getElementById('btnRolePlayer');
            const cBtn = document.getElementById('btnRoleCoach');
            const mBtn = document.getElementById('btnRoleManager');
            const parBtn = document.getElementById('btnRoleParent');

            [bossBtn, pBtn, cBtn, mBtn, parBtn].forEach(b => {
                b.classList.add('hidden');
                b.classList.remove('flex');
            });

            if (actualRole === "BOSS") {
                container.classList.remove('hidden');
                [bossBtn, pBtn, cBtn, mBtn, parBtn].forEach(b => {
                    b.classList.remove('hidden');

        function calculateRadarPolygon(values, maxVal = 100, center = 60, maxRadius = 45) {
            const angles = [-90, -30, 30, 90, 150, 210];
            return values.map((val, idx) => {
                const angleRad = (angles[idx] * Math.PI) / 180;
                const r = (Math.max(12, Math.min(val, maxVal)) / maxVal) * maxRadius;
                return {
                    x: (center + r * Math.cos(angleRad)).toFixed(1),
                    y: (center + r * Math.sin(angleRad)).toFixed(1)
                };
            });
        }

        function renderTacticalPieces(isEditable) {
            const container = document.getElementById('piecesContainer');
            if (!container) return;
            container.innerHTML = "";

            currentTacticPieces.forEach(piece => {
                const div = document.createElement('div');
                div.id = `piece_${piece.id}`;
                div.className = `tactical-piece flex items-center justify-center font-black shadow-2xl transition-transform ${
                    piece.type === 'offense' ? 'w-8 h-8 rounded-full bg-gradient-to-tr from-red-600 to-orange-500 text-white border-2 border-white/80 text-[11px]' :
                    piece.type === 'defense' ? 'w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 text-white border-2 border-white/80 text-[11px]' :
                    'w-7 h-7 rounded-full bg-amber-500 border border-black text-sm'
                }`;
                div.style.left = `${piece.x}%`;
                div.style.top = `${piece.y}%`;
                div.innerText = piece.label;

                // 只有管理層（教練/經理/BOSS）才能拖曳棋子
                if (isEditable) {
                    bindPieceDragEvents(div, piece);
                } else {
                    div.style.cursor = 'default';
                }

                container.appendChild(div);
            });
        }

        function bindPieceDragEvents(element, piece) {
            let isDragging = false;
            const onStart = (e) => { isDragging = true; e.preventDefault(); };
            const onMove = (e) => {
                if (!isDragging) return;
                const court = document.getElementById('courtContainer');
                const rect = court.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                let xPercent = ((clientX - rect.left) / rect.width) * 100;
                let yPercent = ((clientY - rect.top) / rect.height) * 100;

                xPercent = Math.max(4, Math.min(96, xPercent));
                yPercent = Math.max(4, Math.min(96, yPercent));

                piece.x = xPercent;
                piece.y = yPercent;

                element.style.left = `${xPercent}%`;
                element.style.top = `${yPercent}%`;
            };
            const onEnd = () => { isDragging = false; };

            element.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
            element.addEventListener('touchstart', onStart, { passive: false });
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('touchend', onEnd);
        }

            rosterContainer.innerHTML = allPlayers.map(player => {
                const currentRecord = rsvps.find(r => r.player_name === player.name);
                const status = currentRecord ? currentRecord.status : '未標記';
                const avatar = player.photo_url 
                    ? `<img src="${player.photo_url}" class="w-9 h-9 rounded-xl object-cover border border-slate-700">`
                    : `<div class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center font-bold text-xs text-orange-400">#${player.number||7}</div>`;

                return `
                    <div class="bg-slate-900/90 border border-slate-800 p-2.5 rounded-xl flex items-center justify-between text-xs">
                        <div class="flex items-center space-x-2.5">
                            ${avatar}
                            <div>
                                <div class="flex items-center space-x-1.5">
                                    <span class="font-bold text-slate-100">${player.name}</span>
                                    <span class="text-[10px] bg-slate-800 px-1.5 py-0.2 rounded text-amber-300 font-mono">#${player.number}</span>
                                </div>
                                <span class="text-[10px] text-slate-400">${player.team} ｜ ${player.position}</span>
                            </div>
                        </div>
                        <div class="flex space-x-1.5">
                            <button onclick="setPlayerAttendance('${player.name}', '出席', this)" class="px-2.5 py-1 rounded-lg font-bold ${status==='出席'?'bg-emerald-600 text-white shadow':'bg-slate-800 text-slate-400'}">出席</button>
                            <button onclick="setPlayerAttendance('${player.name}', '請假', this)" class="px-2.5 py-1 rounded-lg font-bold ${status==='請假'?'bg-amber-600 text-white shadow':'bg-slate-800 text-slate-400'}">請假</button>
                            <button onclick="setPlayerAttendance('${player.name}', '未到', this)" class="px-2.5 py-1 rounded-lg font-bold ${status==='未到'?'bg-red-600 text-white shadow':'bg-slate-800 text-slate-400'}">未到</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function closeAttendanceModal() {
            document.getElementById('attendanceModal').classList.add('hidden');
            document.getElementById('attendanceModal').classList.remove('flex');
            loadScheduleTab();
        }

        async function setPlayerAttendance(playerName, targetStatus, btnElem) {
            if (!activeAttendanceScheduleId) return;
            const parent = btnElem.parentElement;
            Array.from(parent.children).forEach(b => { b.className = "px-2.5 py-1 rounded-lg font-bold bg-slate-800 text-slate-400"; });
            if (targetStatus === '出席') btnElem.className = "px-2.5 py-1 rounded-lg font-bold bg-emerald-600 text-white shadow";
            else if (targetStatus === '請假') btnElem.className = "px-2.5 py-1 rounded-lg font-bold bg-amber-600 text-white shadow";
            else if (targetStatus === '未到') btnElem.className = "px-2.5 py-1 rounded-lg font-bold bg-red-600 text-white shadow";

            await sb.from('schedule_rsvps').upsert([{
                schedule_id: activeAttendanceScheduleId,
                player_name: playerName,
                status: targetStatus,
                updated_at: new Date().toISOString()
            }], { onConflict: 'schedule_id,player_name' });
        }

        // =========================================================================
        // 課表與晨報點檢
        // =========================================================================
        async function loadAssignmentsTab() {
            const container = document.getElementById('tabContentContainer');
            const { data: tasks } = await sb.from('assignments').select('*').order('id', { ascending: false });
            container.innerHTML = `<div class="glass-card rounded-2xl p-5 space-y-4"><h3 class="font-bold text-orange-400">課表中心</h3>${(tasks||[]).map(t => `<div class="bg-slate-950 p-3 rounded-xl"><h4 class="font-bold text-white">${t.title}</h4><p class="text-xs text-slate-400">目標：${t.target_amount}</p></div>`).join('')}</div>`;
        }

        async function loadDailyStatusTab() {
            const container = document.getElementById('tabContentContainer');
            container.innerHTML = `<div class="glass-card rounded-2xl p-5 space-y-4"><h3 class="font-bold text-orange-400">每日晨報點檢</h3><p class="text-xs text-slate-400">身心體能指數監測中樞</p></div>`;
        }

        function previewAndCompressImage(fileInput, previewElemId, hiddenInputId) {
            const file = fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 400;
                    let w = img.width, h = img.height;
                    if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
                    else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.88);
                    document.getElementById(hiddenInputId).value = compressedBase64;
                    document.getElementById(previewElemId).innerHTML = `<img src="${compressedBase64}" class="w-full h-full object-cover">`;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function openPlayerProfileModal() {
            const { data: p } = await sb.from('players').select('*').eq('name', currentUser.userName).maybeSingle();
            if (p) {
                document.getElementById('editPlayerPos').value = p.position || '控球後衛';
                document.getElementById('editPlayerNum').value = p.number || 7;
                document.getElementById('editPlayerHeight').value = p.height || 178;
                document.getElementById('editPlayerWeight').value = p.weight || 70;
            }
            document.getElementById('playerProfileModal').classList.remove('hidden');
            document.getElementById('playerProfileModal').classList.add('flex');
        }

        function closePlayerProfileModal() {
            document.getElementById('playerProfileModal').classList.add('hidden');
            document.getElementById('playerProfileModal').classList.remove('flex');
        }

        async function savePlayerProfileFinal() {
            const pos = document.getElementById('editPlayerPos').value;
            const num = parseInt(document.getElementById('editPlayerNum').value) || 7;
            const height = parseFloat(document.getElementById('editPlayerHeight').value) || null;
            const weight = parseFloat(document.getElementById('editPlayerWeight').value) || null;
            const photoBase64 = document.getElementById('hiddenPlayerPhotoBase64').value;

            const updatePayload = { position: pos, number: num, height, weight };
            if (photoBase64) updatePayload.photo_url = photoBase64;

            await sb.from('players').update(updatePayload).eq('name', currentUser.userName);
            alert("球員卡已更新！");
            closePlayerProfileModal();
            loadDashboardOverview();
        }

        // BOSS 與一般輔助函式
        function setBossUserFilter(role) {
            bossSelectedFilterRole = role;
            loadDashboardOverview();
        }

        async function bossDeleteUserDirectly(userId, userName) {
            if (!confirm(`確定要將【${userName}】徹底自球隊除名嗎？`)) return;
            await sb.from('users').delete().eq('id', userId);
            await sb.from('players').delete().eq('name', userName);
            await sb.from('daily_checkins').delete().eq('player_name', userName);
            await sb.from('assignment_submissions').delete().eq('player_name', userName);
            alert(`已將【${userName}】除名！`);
            loadDashboardOverview();
        }

        async function approveMember(userId, userName) {
            await sb.from('users').update({ status: '已核准' }).eq('id', userId);
            alert(`已核准【${userName}】！`);
            loadDashboardOverview();
        }

        async function rejectMember(userId, userName) {
            await sb.from('users').delete().eq('id', userId);
            await sb.from('players').delete().eq('name', userName);
            alert(`已拒絕【${userName}】的加入申請。`);
            loadDashboardOverview();
        }

        async function deletePlayerDirectly(playerId, playerName) {
            if (!confirm(`確定要除名球員【${playerName}】嗎？`)) return;
            await sb.from('players').delete().eq('id', playerId);
            await sb.from('users').delete().eq('name', playerName);
            alert(`球員【${playerName}】已除名！`);
            loadDashboardOverview();
        }
    </script>
</body>
</html>
