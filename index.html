<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ｍ＋藍球隊球員系統</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #05070d;
            background-image: radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.15) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.18) 0px, transparent 50%);
            color: #f1f5f9;
        }
        .font-num { font-family: 'Chakra Petch', sans-serif; }
        .glass-card {
            background: rgba(13, 19, 33, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-orange { box-shadow: 0 4px 25px -2px rgba(249, 115, 22, 0.45); }
        .glow-gold { box-shadow: 0 6px 30px -3px rgba(234, 179, 8, 0.55); }
        .card-2k-border {
            border: 1.5px solid transparent;
            background: linear-gradient(rgba(15, 23, 42, 0.94), rgba(11, 15, 25, 0.98)) padding-box,
                        linear-gradient(135deg, #f59e0b, #ea580c, #475569) border-box;
        }
        .radar-mesh { stroke: rgba(255, 255, 255, 0.12); stroke-dasharray: 2 2; }
        
        .court-board {
            position: relative;
            background: #111827;
            border: 2px solid #f97316;
            touch-action: none;
            user-select: none;
        }
        .tactical-piece {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: grab;
            touch-action: none;
        }
        .tactical-piece:active { cursor: grabbing; scale: 1.15; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-5">

    <!-- 頂部導航列 -->
    <header class="w-full max-w-4xl glass-card rounded-2xl p-4 mb-4 flex flex-col md:flex-row justify-between items-center shadow-2xl space-y-3 md:space-y-0 border border-slate-800">
        <div class="flex items-center justify-between w-full md:w-auto">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center font-black text-xl shadow-lg shadow-orange-500/30 text-white">
                    🏀
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-black text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-200">Ｍ＋藍球隊球員系統</h1>
                        <span class="text-[10px] bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2 py-0.5 rounded-full font-bold">PRO</span>
                    </div>
                    <p class="text-xs text-slate-400 font-medium" id="userRoleSubtitle">身分辨識中...</p>
                </div>
            </div>
            <button onclick="logout()" id="logoutBtnMobile" class="md:hidden text-xs bg-red-500/10 border border-red-500/20 text-red-400 px-3 py-1.5 rounded-lg active:scale-95 transition">登出</button>
        </div>

        <!-- 身分切換器 -->
        <div id="roleSwitchContainer" class="hidden flex items-center space-x-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800 text-xs shadow-inner overflow-x-auto max-w-full">
            <button onclick="switchViewRole('BOSS')" id="btnRoleBoss" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-amber-300 bg-amber-500/20 border border-amber-500/40 hover:bg-amber-500 hover:text-black items-center space-x-1 whitespace-nowrap">
                <span>👑</span><span>BOSS總控</span>
            </button>
            <button onclick="switchViewRole('PLAYER')" id="btnRolePlayer" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>🏀</span><span>球員台</span>
            </button>
            <button onclick="switchViewRole('COACH')" id="btnRoleCoach" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>📋</span><span>教練台</span>
            </button>
            <button onclick="switchViewRole('MANAGER')" id="btnRoleManager" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>📊</span><span>經理台</span>
            </button>
            <button onclick="switchViewRole('PARENT')" id="btnRoleParent" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>👨‍👩‍👦</span><span>家長台</span>
            </button>
        </div>

        <div class="hidden md:flex items-center space-x-3">
            <span id="loginStatusBadge" class="text-xs px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 font-medium">未登入</span>
            <button onclick="logout()" id="logoutBtn" class="hidden text-xs bg-red-500/10 hover:bg-red-500 hover:text-white border border-red-500/20 text-red-400 px-3 py-1.5 rounded-xl transition active:scale-95">登出</button>
        </div>
    </header>

    <main class="w-full max-w-4xl flex-1 flex flex-col space-y-4 mb-4 pb-24">

        <!-- 1. 登入面板 -->
        <section id="loginSection" class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center justify-center space-y-6 my-auto border border-slate-800">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 mx-auto bg-gradient-to-tr from-orange-500/20 to-amber-500/10 rounded-2xl border border-orange-500/30 flex items-center justify-center text-3xl mb-2 text-orange-400 glow-orange">
                    🛡️
                </div>
                <h2 class="text-2xl font-black tracking-wide text-white">Ｍ＋藍球隊球員系統</h2>
                <p class="text-xs text-slate-400">專屬多權限分流中控作戰台</p>
            </div>
            <div class="w-full max-w-sm space-y-4">
                <button onclick="handleLineLogin()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition active:scale-95 flex items-center justify-center space-x-2 border border-emerald-500/30">
                    <i class="fab fa-line text-xl"></i>
                    <span>使用 LINE 快速驗證</span>
                </button>
                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-4 text-[11px] text-slate-500 font-semibold uppercase tracking-widest">OR</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>
                <input type="text" id="loginAccount" placeholder="請輸入姓名 (例如: 吳俊璋)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-orange-500 text-slate-200">
                <input type="password" id="loginPassword" placeholder="請輸入密碼 (選填)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-orange-500 text-slate-200">
                <button onclick="handleManualLogin()" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-xl glow-orange transition active:scale-95">
                    進入系統
                </button>
                <div class="text-center pt-2">
                    <button onclick="openRegisterModal()" class="text-xs text-orange-400 hover:text-orange-300 font-bold underline">
                        ✨ 新成員註冊申請
                    </button>
                </div>
            </div>
        </section>

        <!-- 2. 主操作台 -->
        <section id="dashboardSection" class="hidden space-y-4">
            <div class="glass-card rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center border-l-4 border-orange-500 gap-3">
                <div class="flex items-center space-x-3">
                    <div class="text-3xl p-2 bg-slate-800/80 rounded-xl border border-slate-700/60">🌤️</div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-slate-200" id="weatherLocation">台中市大雅區</span>
                            <span class="text-[10px] bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded font-semibold">降雨率 30%</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5">29°C 晴時多雲 ｜ 建議：戶外對抗注意水分補給</p>
                    </div>
                </div>
                <div class="text-right w-full sm:w-auto flex sm:flex-col justify-between items-center sm:items-end border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-800">
                    <span class="text-xs bg-slate-800/80 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-500/20 font-bold flex items-center space-x-1">
                        <span>🔥</span><span>今日隊魂：合一得勝</span>
                    </span>
                    <span class="text-[11px] text-slate-500 font-num mt-1" id="currentDateBadge">--/--</span>
                </div>
            </div>

            <div id="tabContentContainer" class="space-y-4"></div>
        </section>

    </main>

    <!-- 底部導航列 -->
    <nav id="floatingNavbar" class="hidden fixed bottom-4 z-40 max-w-md w-[92%] sm:w-[420px] glass-card bg-slate-950/85 backdrop-blur-xl border border-slate-800/90 rounded-3xl px-3 py-2.5 shadow-2xl shadow-black/80 flex justify-around items-center">
        <button onclick="switchTab('overview')" id="tabBtnOverview" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-bold text-orange-400 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-bolt"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelOverview">主系統台</span>
        </button>
        <button onclick="switchTab('tactics')" id="tabBtnTactics" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-chess-board"></i></span>
            <span class="text-[10px] tracking-wider">戰術戰略</span>
        </button>
        <button onclick="switchTab('assignments')" id="tabBtnAssignments" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-bullseye"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelAssignments">課表中心</span>
        </button>
        <button onclick="switchTab('schedule')" id="tabBtnSchedule" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-calendar-alt"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelSchedule">戰役行程</span>
        </button>
        <button onclick="switchTab('dailystatus')" id="tabBtnDaily" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-heartbeat"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelDaily">晨報點檢</span>
        </button>
    </nav>

    <!-- ✨ 新成員註冊申請 Modal -->
    <div id="registerModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl w-full max-w-md p-6 space-y-4 border border-orange-500/40 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-black text-white flex items-center space-x-2">
                    <span class="text-orange-400">✨</span><span>Ｍ＋藍球隊 - 新成員註冊申請</span>
                </h3>
                <button onclick="closeRegisterModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">真實姓名</label>
                    <input type="text" id="regName" placeholder="例如: 王小明" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">選擇身分權限</label>
                    <select id="regRole" onchange="toggleRegChildField()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200">
                        <option value="球員">🏀 球員</option>
                        <option value="教練">📋 教練</option>
                        <option value="球隊經理">📊 球隊經理</option>
                        <option value="家長">👨‍👩‍👦 家長</option>
                    </select>
                </div>
                <div id="regChildContainer" class="hidden">
                    <label class="text-slate-400 block mb-1 font-semibold">孩子姓名 (球員)</label>
                    <input type="text" id="regChildName" placeholder="請輸入您孩子的球員姓名" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">聯絡電話</label>
                    <input type="text" id="regPhone" placeholder="0912-345678" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200">
                </div>
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="closeRegisterModal()" class="flex-1 py-2.5 bg-slate-800 text-slate-300 rounded-xl font-bold">取消</button>
                <button onclick="submitRegisterApplication()" class="flex-1 py-2.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white rounded-xl font-bold glow-orange">送出註冊申請</button>
            </div>
        </div>
    </div>

    <!-- ➕ 新增行程 Modal (教練/經理/BOSS 專屬) -->
    <div id="createScheduleModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl w-full max-w-md p-6 space-y-4 border border-orange-500/40 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-black text-white flex items-center space-x-2">
                    <span class="text-orange-400">📅</span><span>發布新賽事/訓練行程</span>
                </h3>
                <button onclick="closeCreateScheduleModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">行程名稱</label>
                    <input type="text" id="newSchedTitle" placeholder="例如: 友誼對抗賽 / 平日投籃特訓" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">活動類別</label>
                        <select id="newSchedType" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200">
                            <option value="訓練">平日訓練</option>
                            <option value="比賽">正式比賽</option>
                            <option value="友誼賽">交流友誼賽</option>
                            <option value="聚會">球隊活動</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">活動日期</label>
                        <input type="date" id="newSchedDate" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                </div>
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">活動時間</label>
                    <input type="text" id="newSchedTime" placeholder="例如: 18:30 - 21:00" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">活動地點</label>
                    <input type="text" id="newSchedLocation" placeholder="例如: 台中特殊教育學校體育館" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200">
                </div>
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="closeCreateScheduleModal()" class="flex-1 py-2.5 bg-slate-800 text-slate-300 rounded-xl font-bold">取消</button>
                <button onclick="submitCreateSchedule()" class="flex-1 py-2.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white rounded-xl font-bold glow-orange">立即發布</button>
            </div>
        </div>
    </div>

    <!-- 📋 現場點名 Modal -->
    <div id="attendanceModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl w-full max-w-lg p-6 space-y-4 border border-emerald-500/40 shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 flex-shrink-0">
                <div>
                    <h3 class="text-base font-black text-emerald-400 flex items-center space-x-2">
                        <span>📋</span><span id="attModalTitle">戰役現場點名</span>
                    </h3>
                </div>
                <button onclick="closeAttendanceModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>
            <div id="attendanceRosterList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
            <div class="pt-2 border-t border-slate-800 flex justify-end flex-shrink-0">
                <button onclick="closeAttendanceModal()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold transition">完成點名關閉</button>
            </div>
        </div>
    </div>

    <!-- 👤 編輯球員卡 Modal -->
    <div id="playerProfileModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl w-full max-w-md p-6 space-y-4 border border-amber-500/40 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-black text-white flex items-center space-x-2">
                    <span class="text-orange-400">⚡</span><span>編輯球員卡檔案與照片</span>
                </h3>
                <button onclick="closePlayerProfileModal()" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            <div class="space-y-4 text-xs">
                <div class="flex items-center space-x-4 bg-slate-950 p-3 rounded-2xl border border-slate-800">
                    <div id="playerAvatarPreview" class="w-20 h-20 rounded-2xl bg-slate-900 border-2 border-orange-500/80 overflow-hidden flex items-center justify-center shadow-lg">
                        <span class="font-num text-2xl font-black text-slate-500">#--</span>
                    </div>
                    <div class="flex-1 space-y-2">
                        <label class="text-slate-300 font-bold block">球員照更換 (支援拍照/選圖)</label>
                        <input type="file" id="playerPhotoInput" accept="image/*" onchange="previewAndCompressImage(this, 'playerAvatarPreview', 'hiddenPlayerPhotoBase64')" class="text-[11px] text-slate-400">
                        <input type="hidden" id="hiddenPlayerPhotoBase64">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">守備位置</label>
                        <select id="editPlayerPos" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                            <option value="控球後衛">PG 控球後衛</option>
                            <option value="得分後衛">SG 得分後衛</option>
                            <option value="小前鋒">SF 小前鋒</option>
                            <option value="大前鋒">PF 大前鋒</option>
                            <option value="中鋒">C 中鋒</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">球衣背號</label>
                        <input type="number" id="editPlayerNum" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">身高 (cm)</label>
                        <input type="number" id="editPlayerHeight" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1 font-semibold">體重 (kg)</label>
                        <input type="number" id="editPlayerWeight" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                </div>
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="closePlayerProfileModal()" class="flex-1 py-2.5 bg-slate-800 text-slate-300 rounded-xl font-bold">取消</button>
                <button onclick="savePlayerProfileFinal()" class="flex-1 py-2.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white rounded-xl font-bold glow-orange">確認更新球員卡</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 核心 -->
    <script>

        function calculateRadarPolygon(values, maxVal = 100, center = 60, maxRadius = 45) {
            const angles = [-90, -30, 30, 90, 150, 210];
            return values.map((val, idx) => {
                const angleRad = (angles[idx] * Math.PI) / 180;
                const r = (Math.max(12, Math.min(val, maxVal)) / maxVal) * maxRadius;
                return {
                    x: (center + r * Math.cos(angleRad)).toFixed(1),
                    y: (center + r * Math.sin(angleRad)).toFixed(1)
                };
            });
        }

        function renderTacticalPieces(isEditable) {
            const container = document.getElementById('piecesContainer');
            if (!container) return;
            container.innerHTML = "";
            currentTacticPieces.forEach(piece => {
                const div = document.createElement('div');
                div.className = `tactical-piece flex items-center justify-center font-black shadow-2xl ${piece.type === 'offense' ? 'w-8 h-8 rounded-full bg-red-600 text-white text-[11px]' : piece.type === 'defense' ? 'w-8 h-8 rounded-full bg-blue-600 text-white text-[11px]' : 'w-7 h-7 rounded-full bg-amber-500 text-black text-sm'}`;
                div.style.left = `${piece.x}%`;
                div.style.top = `${piece.y}%`;
                div.innerText = piece.label;
                if (isEditable) bindPieceDragEvents(div, piece);
                container.appendChild(div);
            });
        }

        function bindPieceDragEvents(element, piece) {
            let isDragging = false;
            const onStart = (e) => { isDragging = true; e.preventDefault(); };
            const onMove = (e) => {
                if (!isDragging) return;
                const court = document.getElementById('courtContainer');
                const rect = court.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                piece.x = Math.max(4, Math.min(96, ((clientX - rect.left) / rect.width) * 100));
                piece.y = Math.max(4, Math.min(96, ((clientY - rect.top) / rect.height) * 100));
                element.style.left = `${piece.x}%`;
                element.style.top = `${piece.y}%`;
            };
            const onEnd = () => { isDragging = false; };
            element.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
            element.addEventListener('touchstart', onStart, { passive: false });
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('touchend', onEnd);
        }

                                        <button onclick="promptPlayerLeave(${ev.id})" class="px-3 py-1 bg-slate-800 text-amber-400 rounded-lg font-bold">請假</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openCreateScheduleModal() { document.getElementById('createScheduleModal').classList.remove('hidden'); document.getElementById('createScheduleModal').classList.add('flex'); }
        function closeCreateScheduleModal() { document.getElementById('createScheduleModal').classList.add('hidden'); document.getElementById('createScheduleModal').classList.remove('flex'); }
        async function submitCreateSchedule() {
            const title = document.getElementById('newSchedTitle').value.trim();
            const type = document.getElementById('newSchedType').value;
            const date = document.getElementById('newSchedDate').value;
            const time = document.getElementById('newSchedTime').value.trim();
            const loc = document.getElementById('newSchedLocation').value.trim();

            if (!title || !date || !time) { alert("請填寫完整的行程名稱、日期與時間！"); return; }

            const { error } = await sb.from('schedules').insert([{
                title, event_type: type, event_date: date, event_time: time, location: loc || '未填地點'
            }]);

            if (error) alert("發布失敗：" + error.message);
            else {
                alert("🎉 行程已成功發布！");
                closeCreateScheduleModal();
                loadScheduleTab();
            }
        }

        async function promptPlayerLeave(scheduleId) {
            const reason = prompt("請輸入請假事由：", "學校課業 / 個人事假");
            if (reason === null || !reason.trim()) return;

            try {
                const { error } = await sb.from('schedule_rsvps').upsert([{
                    schedule_id: scheduleId,
                    player_name: currentUser.userName,
                    status: '請假',
                    reason: reason.trim(),
                    updated_at: new Date().toISOString()
                }], { onConflict: 'schedule_id,player_name' });

                if (error) alert("❌ 寫入失敗：" + error.message);
                else {
                    alert("✅ 請假登記成功！LINE 已自動發送詳細通知給經理與 BOSS。");
                    loadScheduleTab();
                }
            } catch (err) { alert("❌ 發生錯誤：" + err.message); }
        }

        async function playerQuickRsvp(scheduleId, status) {
            await sb.from('schedule_rsvps').upsert([{
                schedule_id: scheduleId,
                player_name: currentUser.userName,
                status: status,
                updated_at: new Date().toISOString()
            }], { onConflict: 'schedule_id,player_name' });
            alert(`已登記為：${status}`);
            loadScheduleTab();
        }

        async function openAttendanceModal(scheduleId, eventTitle) {
            activeAttendanceScheduleId = scheduleId;
            document.getElementById('attModalTitle').innerText = `【${eventTitle}】現場點名名冊`;
            const rosterContainer = document.getElementById('attendanceRosterList');
            rosterContainer.innerHTML = `<div class="p-6 text-center text-slate-400"><i class="fas fa-circle-notch fa-spin text-emerald-400 text-xl"></i></div>`;
            document.getElementById('attendanceModal').classList.remove('hidden');
            document.getElementById('attendanceModal').classList.add('flex');

            const [playersRes, rsvpsRes] = await Promise.all([
                sb.from('players').select('*').order('team', { ascending: true }).order('number', { ascending: true }),
                sb.from('schedule_rsvps').select('*').eq('schedule_id', scheduleId)
            ]);

            const allPlayers = playersRes.data || [];
            const rsvps = rsvpsRes.data || [];

            rosterContainer.innerHTML = allPlayers.map(player => {
                const currentRecord = rsvps.find(r => r.player_name === player.name);
                const status = currentRecord ? currentRecord.status : '未標記';
                return `
                    <div class="bg-slate-900/90 border border-slate-800 p-2.5 rounded-xl flex items-center justify-between text-xs">
                        <div><span class="font-bold text-slate-100">${player.name}</span> <span class="text-amber-300">#${player.number}</span></div>
                        <div class="flex space-x-1.5">
                            <button onclick="setPlayerAttendance('${player.name}', '出席', this)" class="px-2.5 py-1 rounded-lg font-bold ${status==='出席'?'bg-emerald-600 text-white':'bg-slate-800 text-slate-400'}">出席</button>
                            <button onclick="setPlayerAttendance('${player.name}', '請假', this)" class="px-2.5 py-1 rounded-lg font-bold ${status==='請假'?'bg-amber-600 text-white':'bg-slate-800 text-slate-400'}">請假</button>
                            <button onclick="setPlayerAttendance('${player.name}', '未到', this)" class="px-2.5 py-1 rounded-lg font-bold ${status==='未到'?'bg-red-600 text-white':'bg-slate-800 text-slate-400'}">未到</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function closeAttendanceModal() {
            document.getElementById('attendanceModal').classList.add('hidden');
            document.getElementById('attendanceModal').classList.remove('flex');
            loadScheduleTab();
        }

        async function setPlayerAttendance(playerName, targetStatus, btnElem) {
            if (!activeAttendanceScheduleId) return;
            const parent = btnElem.parentElement;
            Array.from(parent.children).forEach(b => { b.className = "px-2.5 py-1 rounded-lg font-bold bg-slate-800 text-slate-400"; });
            if (targetStatus === '出席') btnElem.className = "px-2.5 py-1 rounded-lg font-bold bg-emerald-600 text-white";
            else if (targetStatus === '請假') btnElem.className = "px-2.5 py-1 rounded-lg font-bold bg-amber-600 text-white";
            else if (targetStatus === '未到') btnElem.className = "px-2.5 py-1 rounded-lg font-bold bg-red-600 text-white";

            await sb.from('schedule_rsvps').upsert([{
                schedule_id: activeAttendanceScheduleId,
                player_name: playerName,
                status: targetStatus,
                updated_at: new Date().toISOString()
            }], { onConflict: 'schedule_id,player_name' });
        }

        // =========================================================================
        // 🩺 5. 每日晨報點檢
        // =========================================================================
        async function loadDailyStatusTab() {
            const container = document.getElementById('tabContentContainer');
            container.innerHTML = `<div class="glass-card rounded-2xl p-8 text-center text-slate-400"><i class="fas fa-circle-notch fa-spin text-orange-400 text-2xl"></i></div>`;

            const today = new Date().toISOString().split('T')[0];
            const [myCheckinRes, allCheckinsRes] = await Promise.all([
                sb.from('daily_checkins').select('*').eq('checkin_date', today).eq('player_name', currentUser.userName).maybeSingle(),
                sb.from('daily_checkins').select('*').eq('checkin_date', today)
            ]);

            const myCheckin = myCheckinRes.data;
            const allCheckins = allCheckinsRes.data || [];
            const isPlayer = currentUser.role === 'PLAYER';

            container.innerHTML = `
                <div class="space-y-4">
                    ${isPlayer ? `
                        <div class="glass-card rounded-2xl p-5 border border-orange-500/40 space-y-4">
                            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                                <div>
                                    <h3 class="font-bold text-orange-400 text-base">🩺 球員今日身心點檢表 (${today})</h3>
                                    <p class="text-xs text-slate-400">幫助教練精準掌握您的疲勞與恢復狀況</p>
                                </div>
                                ${myCheckin ? `<span class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold">✓ 今日已填寫</span>` : ''}
                            </div>
                            <div class="space-y-3 text-xs">
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="text-slate-300 block mb-1 font-semibold">昨夜睡眠時數 (小時)</label>
                                        <input type="number" step="0.5" id="checkinSleep" value="${myCheckin ? myCheckin.sleep_hours : '7.5'}" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                    </div>
                                    <div>
                                        <label class="text-slate-300 block mb-1 font-semibold">今日精神狀態</label>
                                        <select id="checkinEnergy" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                            <option value="精神飽滿" ${myCheckin&&myCheckin.energy==='精神飽滿'?'selected':''}>🔥 精神飽滿</option>
                                            <option value="良好" ${myCheckin&&myCheckin.energy==='良好'?'selected':''}>⚡ 良好正常</option>
                                            <option value="略感疲倦" ${myCheckin&&myCheckin.energy==='略感疲倦'?'selected':''}>🥱 略感疲倦</option>
                                            <option value="非常疲憊" ${myCheckin&&myCheckin.energy==='非常疲憊'?'selected':''}>💤 非常疲憊</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="text-slate-300 block mb-1 font-semibold">肌肉痠痛部位</label>
                                        <input type="text" id="checkinSore" placeholder="無 / 小腿 / 膝蓋" value="${myCheckin ? myCheckin.sore_area : '無'}" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                    </div>
                                    <div>
                                        <label class="text-slate-300 block mb-1 font-semibold">整體疲勞指數 (1~5分)</label>
                                        <select id="checkinFatigue" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
                                            <option value="1" ${myCheckin&&myCheckin.fatigue==1?'selected':''}>1 分 (完全不累)</option>
                                            <option value="2" ${myCheckin&&myCheckin.fatigue==2?'selected':''}>2 分 (輕鬆自如)</option>
                                            <option value="3" ${myCheckin&&myCheckin.fatigue==3?'selected':''}>3 分 (適度疲累)</option>
                                            <option value="4" ${myCheckin&&myCheckin.fatigue==4?'selected':''}>4 分 (相當沉重)</option>
                                            <option value="5" ${myCheckin&&myCheckin.fatigue==5?'selected':''}>5 分 (極度疲倦)</option>
                                        </select>
                                    </div>
                                </div>
                                <button onclick="submitDailyCheckin()" class="w-full py-3 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-xl glow-orange transition">
                                    ${myCheckin ? '更新今日點檢資料' : '提交今日點檢'}
                                </button>
                            </div>
                        </div>
                    ` : ''}

                    <div class="glass-card rounded-2xl p-5 space-y-4">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-white text-base">📊 全隊今日晨報監控 (${allCheckins.length} 位已提交)</h3>
                        </div>
                        <div class="space-y-2">
                            ${allCheckins.length > 0 ? allCheckins.map(c => `
                                <div class="bg-slate-950/80 border border-slate-800 p-3.5 rounded-xl flex justify-between items-center text-xs">
                                    <div>
                                        <span class="font-bold text-white text-sm">${c.player_name}</span>
                                        <span class="text-slate-400 ml-2">睡眠: <span class="text-amber-400 font-bold">${c.sleep_hours}hr</span> ｜ 精神: ${c.energy}</span>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-[10px] px-2 py-0.5 rounded font-bold ${c.fatigue>=4?'bg-red-500/20 text-red-400':'bg-emerald-500/20 text-emerald-400'}">疲勞 ${c.fatigue}/5</span>
                                        <span class="text-slate-400 block text-[11px] mt-0.5">痠痛: ${c.sore_area}</span>
                                    </div>
                                </div>
                            `).join('') : '<p class="text-xs text-slate-500 py-3 text-center">今日尚無球員回報晨報！</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        async function submitDailyCheckin() {
            const today = new Date().toISOString().split('T')[0];
            const sleep = parseFloat(document.getElementById('checkinSleep').value) || 7.0;
            const energy = document.getElementById('checkinEnergy').value;
            const sore = document.getElementById('checkinSore').value.trim() || '無';
            const fatigue = parseInt(document.getElementById('checkinFatigue').value) || 2;

            const { error } = await sb.from('daily_checkins').upsert([{
                player_name: currentUser.userName,
                checkin_date: today,
                sleep_hours: sleep,
                energy: energy,
                sore_area: sore,
                fatigue: fatigue
            }], { onConflict: 'player_name,checkin_date' });

            if (error) alert("提交失敗：" + error.message);
            else {
                alert("🎉 今日身心晨報點檢已成功提交！");
                loadDailyStatusTab();
            }
        }

        // 註冊與其他輔助函式
        function openRegisterModal() { document.getElementById('registerModal').classList.remove('hidden'); document.getElementById('registerModal').classList.add('flex'); }
        function closeRegisterModal() { document.getElementById('registerModal').classList.add('hidden'); document.getElementById('registerModal').classList.remove('flex'); }
        function toggleRegChildField() {
            const role = document.getElementById('regRole').value;
            const childContainer = document.getElementById('regChildContainer');
            if (role === '家長') childContainer.classList.remove('hidden');
            else childContainer.classList.add('hidden');
        }
        async function submitRegisterApplication() {
            const name = document.getElementById('regName').value.trim();
            const role = document.getElementById('regRole').value;
            const phone = document.getElementById('regPhone').value.trim();
            const childName = document.getElementById('regChildName').value.trim();

            if (!name) { alert("請填寫姓名！"); return; }
            if (!phone) { alert("請填寫聯絡電話！"); return; }

            const newUserPayload = { name, role, phone, status: '待審核', line_id: currentLineUserId || null };
            if (role === '家長') newUserPayload.child_name = childName;

            const { error } = await sb.from('users').insert([newUserPayload]);
            if (error) alert("註冊申請送出失敗：" + error.message);
            else { 
                alert("🎉 註冊申請已成功送出！系統已自動發送 LINE 通知經理與 BOSS，請靜候核准。"); 
                closeRegisterModal(); 
            }
        }

        // 審核成員專用函式 (經理/BOSS 共同使用)
        async function approveMember(id, name, role) {
            const { error } = await sb.from('users').update({ status: '已核准' }).eq('id', id);
            if (error) {
                alert("核准失敗：" + error.message);
                return;
            }

            if (role === '球員') {
                const { data: existingPlayer } = await sb.from('players').select('*').eq('name', name).maybeSingle();
                if (!existingPlayer) {
                    await sb.from('players').insert([{
                        name: name,
                        number: 0,
                        position: '控球後衛',
                        team: '大隊',
                        height: 175,
                        weight: 68,
                        offense: 80,
                        defense: 80,
                        fitness: 80,
                        attitude: 85,
                        agility: 80,
                        bball_iq: 80
                    }]);
                }
            }

            alert(`🎉 已成功核准【${name}】加入球隊系統！`);
            loadDashboardOverview();
        }

        async function rejectMember(id, name) {
            if (!confirm(`確定要拒絕【${name}】的註冊申請嗎？`)) return;
            const { error } = await sb.from('users').delete().eq('id', id);
            if (error) alert("操作失敗：" + error.message);
            else {
                alert(`已拒絕並移除【${name}】的申請。`);
                loadDashboardOverview();
            }
        }

        function previewAndCompressImage(input, previewId, hiddenId) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById(hiddenId).value = e.target.result;
                document.getElementById(previewId).innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
            };
            reader.readAsDataURL(file);
        }
        async function openPlayerProfileModal() { document.getElementById('playerProfileModal').classList.remove('hidden'); document.getElementById('playerProfileModal').classList.add('flex'); }
        async function closePlayerProfileModal() { document.getElementById('playerProfileModal').classList.add('hidden'); document.getElementById('playerProfileModal').classList.remove('flex'); }
        async function savePlayerProfileFinal() {
            const pos = document.getElementById('editPlayerPos').value;
            const num = parseInt(document.getElementById('editPlayerNum').value) || 7;
            const h = parseFloat(document.getElementById('editPlayerHeight').value) || null;
            const w = parseFloat(document.getElementById('editPlayerWeight').value) || null;
            const photo = document.getElementById('hiddenPlayerPhotoBase64').value;
            const payload = { position: pos, number: num, height: h, weight: w };
            if (photo) payload.photo_url = photo;
            await sb.from('players').update(payload).eq('name', currentUser.userName);
            alert("球員卡已更新！"); closePlayerProfileModal(); loadDashboardOverview();
        }
        function setBossUserFilter(role) { bossSelectedFilterRole = role; loadDashboardOverview(); }
        async function bossDeleteUserDirectly(id, name) { if(!confirm(`除名 ${name}?`))return; await sb.from('users').delete().eq('id', id); loadDashboardOverview(); }
        async function deletePlayerDirectly(id, name) { if(!confirm(`除名 ${name}?`))return; await sb.from('players').delete().eq('id', id); loadDashboardOverview(); }
    </script>
</body>
</html>
