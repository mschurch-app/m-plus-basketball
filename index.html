<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M+ 籃球隊官方戰情中控台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #05070d;
            background-image: radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.15) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.18) 0px, transparent 50%);
            color: #f1f5f9;
        }
        .font-num { font-family: 'Chakra Petch', sans-serif; }
        .glass-card {
            background: rgba(13, 19, 33, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-orange { box-shadow: 0 4px 25px -2px rgba(249, 115, 22, 0.45); }
        .glow-gold { box-shadow: 0 6px 30px -3px rgba(234, 179, 8, 0.55); }
        .card-2k-border {
            border: 1.5px solid transparent;
            background: linear-gradient(rgba(15, 23, 42, 0.94), rgba(11, 15, 25, 0.98)) padding-box,
                        linear-gradient(135deg, #f59e0b, #ea580c, #475569) border-box;
        }
        .radar-mesh {
            stroke: rgba(255, 255, 255, 0.12);
            stroke-dasharray: 2 2;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-5">

    <!-- 頂部導航列 -->
    <header class="w-full max-w-4xl glass-card rounded-2xl p-4 mb-4 flex flex-col md:flex-row justify-between items-center shadow-2xl space-y-3 md:space-y-0 border border-slate-800">
        <div class="flex items-center justify-between w-full md:w-auto">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center font-black text-xl shadow-lg shadow-orange-500/30 text-white">
                    🏀
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-black text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-200">M+ 戰情中心</h1>
                        <span class="text-[10px] bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2 py-0.5 rounded-full font-bold">2K ELITE</span>
                    </div>
                    <p class="text-xs text-slate-400 font-medium" id="userRoleSubtitle">身分辨識中...</p>
                </div>
            </div>
            <button onclick="logout()" id="logoutBtnMobile" class="md:hidden text-xs bg-red-500/10 border border-red-500/20 text-red-400 px-3 py-1.5 rounded-lg active:scale-95 transition">登出</button>
        </div>

        <div id="roleSwitchContainer" class="hidden flex items-center space-x-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800 text-xs shadow-inner overflow-x-auto max-w-full">
            <button onclick="switchViewRole('BOSS')" id="btnRoleBoss" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-amber-300 bg-amber-500/20 border border-amber-500/40 hover:bg-amber-500 hover:text-black items-center space-x-1 whitespace-nowrap">
                <span>👑</span><span>BOSS總控</span>
            </button>
            <button onclick="switchViewRole('PLAYER')" id="btnRolePlayer" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>🏀</span><span>球員台</span>
            </button>
            <button onclick="switchViewRole('COACH')" id="btnRoleCoach" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>📋</span><span>教練台</span>
            </button>
            <button onclick="switchViewRole('MANAGER')" id="btnRoleManager" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>📊</span><span>經理台</span>
            </button>
            <button onclick="switchViewRole('PARENT')" id="btnRoleParent" class="hidden px-2.5 py-1.5 rounded-lg transition font-bold text-slate-400 hover:text-white items-center space-x-1 whitespace-nowrap">
                <span>👨‍👩‍👦</span><span>家長台</span>
            </button>
        </div>

        <div class="hidden md:flex items-center space-x-3">
            <span id="loginStatusBadge" class="text-xs px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 font-medium">未登入</span>
            <button onclick="logout()" id="logoutBtn" class="hidden text-xs bg-red-500/10 hover:bg-red-500 hover:text-white border border-red-500/20 text-red-400 px-3 py-1.5 rounded-xl transition active:scale-95">登出</button>
        </div>
    </header>

    <main class="w-full max-w-4xl flex-1 flex flex-col space-y-4 mb-4 pb-24">

        <!-- 登入面板 -->
        <section id="loginSection" class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center justify-center space-y-6 my-auto border border-slate-800">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 mx-auto bg-gradient-to-tr from-orange-500/20 to-amber-500/10 rounded-2xl border border-orange-500/30 flex items-center justify-center text-3xl mb-2 text-orange-400 glow-orange">
                    🛡️
                </div>
                <h2 class="text-2xl font-black tracking-wide text-white">M+ 戰情系統驗證</h2>
                <p class="text-xs text-slate-400">專屬多權限分流中控作戰台</p>
            </div>
            <div class="w-full max-w-sm space-y-4">
                <button onclick="handleLineLogin()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition active:scale-95 flex items-center justify-center space-x-2 border border-emerald-500/30">
                    <i class="fab fa-line text-xl"></i>
                    <span>使用 LINE 快速驗證</span>
                </button>
                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-4 text-[11px] text-slate-500 font-semibold uppercase tracking-widest">OR</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>
                <input type="text" id="loginAccount" placeholder="請輸入姓名 (例如: 吳俊璋)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-orange-500 text-slate-200">
                <input type="password" id="loginPassword" placeholder="請輸入密碼" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-orange-500 text-slate-200">
                <button onclick="handleManualLogin()" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-xl glow-orange transition active:scale-95">
                    進入戰情室
                </button>
            </div>
        </section>

        <!-- 主操作台 -->
        <section id="dashboardSection" class="hidden space-y-4">
            <div class="glass-card rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center border-l-4 border-orange-500 gap-3">
                <div class="flex items-center space-x-3">
                    <div class="text-3xl p-2 bg-slate-800/80 rounded-xl border border-slate-700/60">🌤️</div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-slate-200" id="weatherLocation">台中市大雅區</span>
                            <span class="text-[10px] bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded font-semibold" id="weatherRainProb">降雨率 30%</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5" id="weatherDesc">29°C 晴時多雲 ｜ 建議：戶外對抗注意水分補給</p>
                    </div>
                </div>
                <div class="text-right w-full sm:w-auto flex sm:flex-col justify-between items-center sm:items-end border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-800">
                    <span class="text-xs bg-slate-800/80 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-500/20 font-bold flex items-center space-x-1">
                        <span>🔥</span><span>今日隊魂：合一得勝</span>
                    </span>
                    <span class="text-[11px] text-slate-500 font-num mt-1" id="currentDateBadge">--/--</span>
                </div>
            </div>

            <div id="tabContentContainer" class="space-y-4"></div>
        </section>

    </main>

    <!-- 底部現代毛玻璃浮動導航列 -->
    <nav id="floatingNavbar" class="hidden fixed bottom-4 z-40 max-w-md w-[92%] sm:w-[420px] glass-card bg-slate-950/85 backdrop-blur-xl border border-slate-800/90 rounded-3xl px-3 py-2.5 shadow-2xl shadow-black/80 flex justify-around items-center">
        <button onclick="switchTab('overview')" id="tabBtnOverview" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-bold text-orange-400 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-bolt"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelOverview">主戰情室</span>
        </button>
        <button onclick="switchTab('assignments')" id="tabBtnAssignments" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-bullseye"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelAssignments">課表中心</span>
        </button>
        <button onclick="switchTab('schedule')" id="tabBtnSchedule" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-calendar-alt"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelSchedule">戰役行程</span>
        </button>
        <button onclick="switchTab('dailystatus')" id="tabBtnDaily" class="nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-lg mb-0.5"><i class="fas fa-heartbeat"></i></span>
            <span class="text-[10px] tracking-wider" id="navLabelDaily">晨報點檢</span>
        </button>
    </nav>

    <!-- 📋 經理專屬：現場即時點名名冊 Modal -->
    <div id="attendanceModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl w-full max-w-lg p-6 space-y-4 border border-emerald-500/40 shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 flex-shrink-0">
                <div>
                    <h3 class="text-base font-black text-emerald-400 flex items-center space-x-2">
                        <span>📋</span><span id="attModalTitle">戰役現場點名</span>
                    </h3>
                    <p class="text-[11px] text-slate-400 mt-0.5" id="attModalSubtitle">點擊按鈕直接登記出缺席狀態</p>
                </div>
                <button onclick="closeAttendanceModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>
            
            <!-- 點名名單清單容器 -->
            <div id="attendanceRosterList" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <!-- 動態注入球員清單 -->
            </div>

            <div class="pt-2 border-t border-slate-800 flex justify-end flex-shrink-0">
                <button onclick="closeAttendanceModal()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold transition">
                    完成點名關閉
                </button>
            </div>
        </div>
    </div>

    <!-- 行程發布 Modal -->
    <div id="eventModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl w-full max-w-md p-6 space-y-4 border border-slate-700 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-black text-white">📅 發布戰役行程</h3>
                <button onclick="closeEventModal()" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">活動日期</label>
                    <input type="date" id="evDate" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">時間</label>
                    <input type="text" id="evTime" placeholder="例如: 19:00 - 21:00" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">活動類型</label>
                    <select id="evType" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200">
                        <option value="🏀 例行訓練">🏀 例行訓練</option>
                        <option value="⚔️ 正式賽事">⚔️ 正式賽事</option>
                        <option value="🏋️ 體能對抗">🏋️ 體能對抗</option>
                    </select>
                </div>
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">行程標題</label>
                    <input type="text" id="evTitle" placeholder="例如: 週末錦標賽" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1 font-semibold">地點</label>
                    <input type="text" id="evLocation" placeholder="例如: 西屯球場" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200">
                </div>
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="closeEventModal()" class="flex-1 py-2.5 bg-slate-800 text-slate-300 rounded-xl font-bold">取消</button>
                <button onclick="saveScheduleEventFinal()" class="flex-1 py-2.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white rounded-xl font-bold glow-orange">確認發布</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 核心 -->
    <script>
        const SUPABASE_URL = "https://ldsedanswynbzymyfwox.supabase.co";
        const SUPABASE_KEY = "sb_publishable_M1akQ21ePT5OVjpjO1kc8A_2GqObjrT";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = { actualRole: null, role: null, userName: null, roleText: null, childName: null, status: null };
        let currentActiveTab = 'overview';
        let activeAttendanceScheduleId = null;

        window.addEventListener("DOMContentLoaded", () => {
            const todayStr = new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', weekday: 'short' });
            document.getElementById('currentDateBadge').innerText = todayStr;
            initializeLiff();
        });

        function initializeLiff() {
            if (typeof liff === 'undefined') return;
            liff.init({ liffId: "2011574321-QGPq8PoR" }).then(() => {
                if (liff.isLoggedIn()) {
                    const profile = liff.getDecodedIDToken();
                    if (profile && profile.sub) autoLoginWithLine(profile.sub, profile.name);
                }
            }).catch(err => console.log("LIFF Error:", err));
        }

        async function autoLoginWithLine(lineUserId, lineName = "") {
            try {
                const { data } = await sb.from('users').select('*').eq('line_id', lineUserId).maybeSingle();
                if (data) processLoginSuccess(data);
            } catch (e) { console.log(e); }
        }

        async function handleLineLogin() {
            if (typeof liff !== 'undefined' && liff.isInClient()) {
                if (!liff.isLoggedIn()) { liff.login(); return; }
                const profile = liff.getDecodedIDToken();
                if (profile && profile.sub) autoLoginWithLine(profile.sub, profile.name);
            } else {
                alert("請直接在下方輸入姓名登入測試！");
            }
        }

        async function handleManualLogin() {
            const acc = document.getElementById('loginAccount').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            if (!acc) { alert("請輸入姓名！"); return; }

            const { data, error } = await sb.from('users').select('*').eq('name', acc).maybeSingle();
            if (error) { alert("連線異常：" + error.message); return; }

            if (!data) {
                alert(`查無【${acc}】的資料！`);
            } else {
                if (data.password && pass && data.password !== pass) {
                    alert("密碼不正確！");
                    return;
                }
                processLoginSuccess(data);
            }
        }

        function processLoginSuccess(userRecord) {
            const isBoss = userRecord.name === "吳俊璋" || userRecord.role.indexOf("BOSS") !== -1;
            let roleCode = "PLAYER";
            if (userRecord.role === "教練") roleCode = "COACH";
            if (userRecord.role === "球隊經理") roleCode = "MANAGER";
            if (userRecord.role === "家長") roleCode = "PARENT";
            if (isBoss) roleCode = "BOSS";

            currentUser = {
                actualRole: roleCode,
                role: roleCode,
                userName: userRecord.name,
                roleText: userRecord.role,
                childName: userRecord.child_name || null,
                status: userRecord.status
            };

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('floatingNavbar').classList.remove('hidden');
            document.getElementById('loginStatusBadge').innerText = `${currentUser.userName} (${currentUser.roleText})`;
            document.getElementById('loginStatusBadge').className = "text-xs px-3 py-1.5 rounded-full bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 font-bold";
            document.getElementById('logoutBtn').classList.remove('hidden');
            document.getElementById('userRoleSubtitle').innerText = `${currentUser.userName} (${currentUser.roleText})`;

            setupRoleSwitchPermissions(currentUser.actualRole);
            updateRoleSwitchButtons();
            switchTab('overview');
        }

        function setupRoleSwitchPermissions(actualRole) {
            const container = document.getElementById('roleSwitchContainer');
            const bossBtn = document.getElementById('btnRoleBoss');
            const pBtn = document.getElementById('btnRolePlayer');
            const cBtn = document.getElementById('btnRoleCoach');
            const mBtn = document.getElementById('btnRoleManager');
            const parBtn = document.getElementById('btnRoleParent');

            [bossBtn, pBtn, cBtn, mBtn, parBtn].forEach(b => {
                b.classList.add('hidden');
                b.classList.remove('flex');
            });

            if (actualRole === "BOSS") {
                container.classList.remove('hidden');
                [bossBtn, pBtn, cBtn, mBtn, parBtn].forEach(b => {
                    b.classList.remove('hidden');
                    b.classList.add('flex');
                });
            } else if (actualRole === "COACH") {
                container.classList.remove('hidden');
                [cBtn, mBtn].forEach(b => { b.classList.remove('hidden'); b.classList.add('flex'); });
            } else if (actualRole === "MANAGER") {
                container.classList.remove('hidden');
                [mBtn, parBtn].forEach(b => { b.classList.remove('hidden'); b.classList.add('flex'); });
            } else {
                container.classList.add('hidden');
            }
        }

        function switchViewRole(targetRole) {
            currentUser.role = targetRole;
            updateRoleSwitchButtons();
            switchTab(currentActiveTab);
        }

        function updateRoleSwitchButtons() {
            const bossBtn = document.getElementById('btnRoleBoss');
            const pBtn = document.getElementById('btnRolePlayer');
            const cBtn = document.getElementById('btnRoleCoach');
            const mBtn = document.getElementById('btnRoleManager');
            const parBtn = document.getElementById('btnRoleParent');

            [bossBtn, pBtn, cBtn, mBtn, parBtn].forEach(b => {
                b.className = b.className.replace(/bg-orange-500|bg-amber-500|text-black|text-white|glow-orange|glow-gold/g, '').trim();
                if (!b.className.includes('text-slate-400') && b !== bossBtn) b.className += " text-slate-400";
            });

            if (currentUser.role === "BOSS") {
                bossBtn.className = "px-2.5 py-1.5 rounded-lg transition font-bold bg-amber-500 text-black shadow glow-gold flex items-center space-x-1 whitespace-nowrap";
            } else if (currentUser.role === "PLAYER") {
                pBtn.className = "px-2.5 py-1.5 rounded-lg transition font-bold bg-orange-500 text-white shadow glow-orange flex items-center space-x-1 whitespace-nowrap";
            } else if (currentUser.role === "COACH") {
                cBtn.className = "px-2.5 py-1.5 rounded-lg transition font-bold bg-orange-500 text-white shadow glow-orange flex items-center space-x-1 whitespace-nowrap";
            } else if (currentUser.role === "MANAGER") {
                mBtn.className = "px-2.5 py-1.5 rounded-lg transition font-bold bg-orange-500 text-white shadow glow-orange flex items-center space-x-1 whitespace-nowrap";
            } else if (currentUser.role === "PARENT") {
                parBtn.className = "px-2.5 py-1.5 rounded-lg transition font-bold bg-orange-500 text-white shadow glow-orange flex items-center space-x-1 whitespace-nowrap";
            }
        }

        function logout() {
            currentUser = { actualRole: null, role: null, userName: null, roleText: null, childName: null, status: null };
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('floatingNavbar').classList.add('hidden');
            document.getElementById('roleSwitchContainer').classList.add('hidden');
            document.getElementById('loginStatusBadge').innerText = "未登入";
            document.getElementById('loginStatusBadge').className = "text-xs px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 font-medium";
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('userRoleSubtitle').innerText = "身分辨識中...";
        }

        function switchTab(tabName) {
            currentActiveTab = tabName;
            ['overview', 'assignments', 'schedule', 'daily'].forEach(t => {
                const btn = document.getElementById(`tabBtn${t.charAt(0).toUpperCase() + t.slice(1)}`);
                if (btn) {
                    btn.className = (t === tabName || (t==='daily' && tabName==='dailystatus'))
                        ? "nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-bold text-orange-400 scale-105 transition active:scale-90"
                        : "nav-item flex-1 py-1.5 flex flex-col items-center justify-center text-xs font-medium text-slate-400 hover:text-slate-200 transition active:scale-90";
                }
            });

            if (tabName === 'overview') loadDashboardOverview();
            else if (tabName === 'assignments') loadAssignmentsTab();
            else if (tabName === 'schedule') loadScheduleTab();
            else if (tabName === 'dailystatus') loadDailyStatusTab();
        }

        // =========================================================================
        // ⚡ 1. 主戰情室
        // =========================================================================
        async function loadDashboardOverview() {
            const container = document.getElementById('tabContentContainer');
            container.innerHTML = `<div class="glass-card rounded-2xl p-8 text-center text-slate-400"><i class="fas fa-circle-notch fa-spin text-orange-400 text-2xl"></i></div>`;

            const [pRes, tasksRes] = await Promise.all([
                sb.from('players').select('*').eq('name', currentUser.userName).maybeSingle(),
                sb.from('assignments').select('*').order('id', { ascending: false })
            ]);

            const pData = pRes.data || { name: currentUser.userName, number: 7, position: '控球後衛', team: '大隊', height: 178, weight: 70, offense: 85, defense: 90, fitness: 88, attitude: 96, agility: 89, bball_iq: 87 };

            container.innerHTML = `
                <div class="card-2k-border rounded-3xl p-5 shadow-2xl">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-xl font-black text-white">${currentUser.userName} <span class="text-orange-400 font-num">#${pData.number}</span></h2>
                            <p class="text-xs text-slate-400 mt-1">${pData.team} ｜ ${pData.position} ｜ ${pData.height}cm / ${pData.weight}kg</p>
                        </div>
                        <span class="text-xs bg-orange-500/20 text-orange-400 border border-orange-500/30 px-3 py-1 rounded-full font-bold">戰情待命</span>
                    </div>
                </div>
            `;
        }

        // =========================================================================
        // 📅 2. 戰役行程與經理現場點名中樞
        // =========================================================================
        async function loadScheduleTab() {
            const container = document.getElementById('tabContentContainer');
            container.innerHTML = `<div class="glass-card rounded-2xl p-8 text-center text-slate-400"><i class="fas fa-circle-notch fa-spin text-orange-400 text-2xl"></i></div>`;

            const { data: list } = await sb.from('schedules').select('*, schedule_rsvps(*)').order('event_date', { ascending: true });
            const schedules = list || [];
            
            // 判斷是否為具有點名權限的身分 (經理、教練、BOSS)
            const canManageAttendance = ["MANAGER", "COACH", "BOSS"].includes(currentUser.role) || ["MANAGER", "COACH", "BOSS"].includes(currentUser.actualRole);

            container.innerHTML = `
                <div class="glass-card rounded-2xl p-5 space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                        <div>
                            <h3 class="font-bold text-orange-400 text-base flex items-center space-x-2">
                                <span>📅</span><span>球隊賽事與訓練行事曆</span>
                            </h3>
                            <p class="text-xs text-slate-400">經理與教練可針對每場活動執行現場點名</p>
                        </div>
                        ${canManageAttendance ? `
                            <button onclick="openEventModal()" class="px-3.5 py-1.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white text-xs font-bold rounded-xl glow-orange active:scale-95 transition">
                                + 發布行程
                            </button>
                        ` : ''}
                    </div>

                    <div class="space-y-3">
                        ${schedules.length > 0 ? schedules.map(ev => {
                            const rsvps = ev.schedule_rsvps || [];
                            const attends = rsvps.filter(r => r.status === '出席');
                            const leaves = rsvps.filter(r => r.status === '請假');
                            const absents = rsvps.filter(r => r.status === '未到');

                            return `
                                <div class="bg-slate-950/80 border border-slate-800 p-4 rounded-2xl space-y-3">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <div class="flex items-center space-x-2">
                                                <span class="text-xs px-2 py-0.5 rounded font-bold bg-orange-500/20 text-orange-400 border border-orange-500/30">${ev.event_type}</span>
                                                <h4 class="font-bold text-slate-100 text-sm sm:text-base">${ev.title}</h4>
                                            </div>
                                            <p class="text-xs text-slate-400 mt-1">時間：${ev.event_date} ${ev.event_time} ｜ 地點：${ev.location}</p>
                                        </div>
                                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.location)}" target="_blank" class="text-xs bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg text-blue-400 hover:text-white flex items-center space-x-1">
                                            <i class="fas fa-location-arrow"></i><span>導航</span>
                                        </a>
                                    </div>

                                    <!-- 點名即時統計條 -->
                                    <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-800/80 text-xs">
                                        <div class="flex items-center space-x-3">
                                            <span class="text-emerald-400 font-bold"><i class="fas fa-check-circle mr-1"></i>出席 ${attends.length}</span>
                                            <span class="text-amber-400 font-bold"><i class="fas fa-exclamation-circle mr-1"></i>請假 ${leaves.length}</span>
                                            <span class="text-red-400 font-bold"><i class="fas fa-times-circle mr-1"></i>未到 ${absents.length}</span>
                                        </div>

                                        <!-- 經理點名入口按鈕 -->
                                        ${canManageAttendance ? `
                                            <button onclick="openAttendanceModal(${ev.id}, '${ev.title}')" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold flex items-center space-x-1.5 shadow-lg shadow-emerald-600/30 transition active:scale-95">
                                                <i class="fas fa-user-check"></i><span>現場點名板</span>
                                            </button>
                                        ` : `
                                            <div class="flex space-x-2">
                                                <button onclick="playerQuickRsvp(${ev.id}, '出席')" class="px-3 py-1 bg-emerald-600 text-white rounded-lg font-bold">出席</button>
                                                <button onclick="playerQuickRsvp(${ev.id}, '請假')" class="px-3 py-1 bg-slate-800 text-slate-300 rounded-lg">請假</button>
                                            </div>
                                        `}
                                    </div>
                                </div>
                            `;
                        }).join('') : '<p class="text-xs text-slate-500 text-center py-6">目前沒有排定戰役或訓練行程</p>'}
                    </div>
                </div>
            `;
        }

        // =========================================================================
        // 📋 3. 現場點名名冊彈窗與即時切換邏輯
        // =========================================================================
        async function openAttendanceModal(scheduleId, eventTitle) {
            activeAttendanceScheduleId = scheduleId;
            document.getElementById('attModalTitle').innerText = `【${eventTitle}】現場點名名冊`;
            const rosterContainer = document.getElementById('attendanceRosterList');
            rosterContainer.innerHTML = `<div class="p-6 text-center text-slate-400"><i class="fas fa-circle-notch fa-spin text-emerald-400 text-xl"></i></div>`;
            
            document.getElementById('attendanceModal').classList.remove('hidden');
            document.getElementById('attendanceModal').classList.add('flex');

            // 平行抓取全隊球員清單與該行程目前的所有 RSVP 紀錄
            const [playersRes, rsvpsRes] = await Promise.all([
                sb.from('players').select('*').order('team', { ascending: true }).order('number', { ascending: true }),
                sb.from('schedule_rsvps').select('*').eq('schedule_id', scheduleId)
            ]);

            const allPlayers = playersRes.data || [];
            const rsvps = rsvpsRes.data || [];

            rosterContainer.innerHTML = allPlayers.map(player => {
                const currentRecord = rsvps.find(r => r.player_name === player.name);
                const status = currentRecord ? currentRecord.status : '未標記';

                const avatar = player.photo_url 
                    ? `<img src="${player.photo_url}" class="w-10 h-10 rounded-xl object-cover border border-slate-700">`
                    : `<div class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center font-bold text-xs text-orange-400">#${player.number||7}</div>`;

                return `
                    <div class="bg-slate-900/90 border border-slate-800 p-2.5 rounded-xl flex items-center justify-between text-xs">
                        <div class="flex items-center space-x-2.5">
                            ${avatar}
                            <div>
                                <div class="flex items-center space-x-1.5">
                                    <span class="font-bold text-slate-100">${player.name}</span>
                                    <span class="text-[10px] bg-slate-800 px-1.5 py-0.2 rounded text-amber-300 font-mono">#${player.number}</span>
                                </div>
                                <span class="text-[10px] text-slate-400">${player.team} ｜ ${player.position}</span>
                            </div>
                        </div>

                        <!-- 經理點名按鈕組 -->
                        <div class="flex space-x-1.5">
                            <button onclick="setPlayerAttendance('${player.name}', '出席', this)" class="px-2.5 py-1 rounded-lg font-bold transition ${status === '出席' ? 'bg-emerald-600 text-white shadow' : 'bg-slate-800 text-slate-400 hover:text-white'}">
                                ✅ 出席
                            </button>
                            <button onclick="setPlayerAttendance('${player.name}', '請假', this)" class="px-2.5 py-1 rounded-lg font-bold transition ${status === '請假' ? 'bg-amber-600 text-white shadow' : 'bg-slate-800 text-slate-400 hover:text-white'}">
                                ⚠️ 請假
                            </button>
                            <button onclick="setPlayerAttendance('${player.name}', '未到', this)" class="px-2.5 py-1 rounded-lg font-bold transition ${status === '未到' ? 'bg-red-600 text-white shadow' : 'bg-slate-800 text-slate-400 hover:text-white'}">
                                ❌ 未到
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function closeAttendanceModal() {
            document.getElementById('attendanceModal').classList.add('hidden');
            document.getElementById('attendanceModal').classList.remove('flex');
            activeAttendanceScheduleId = null;
            loadScheduleTab(); // 重新整理行程卡片出席統計
        }

        // 經理點名直接更新狀態
        async function setPlayerAttendance(playerName, targetStatus, btnElem) {
            if (!activeAttendanceScheduleId) return;

            // 樂觀更新 UI 顏色
            const parent = btnElem.parentElement;
            Array.from(parent.children).forEach(b => {
                b.className = "px-2.5 py-1 rounded-lg font-bold transition bg-slate-800 text-slate-400 hover:text-white";
            });
            if (targetStatus === '出席') btnElem.className = "px-2.5 py-1 rounded-lg font-bold transition bg-emerald-600 text-white shadow";
            else if (targetStatus === '請假') btnElem.className = "px-2.5 py-1 rounded-lg font-bold transition bg-amber-600 text-white shadow";
            else if (targetStatus === '未到') btnElem.className = "px-2.5 py-1 rounded-lg font-bold transition bg-red-600 text-white shadow";

            // 寫入 Supabase (Upsert)
            await sb.from('schedule_rsvps').upsert([{
                schedule_id: activeAttendanceScheduleId,
                player_name: playerName,
                status: targetStatus,
                updated_at: new Date().toISOString()
            }], { onConflict: 'schedule_id,player_name' });
        }

        async function playerQuickRsvp(scheduleId, status) {
            await sb.from('schedule_rsvps').upsert([{
                schedule_id: scheduleId,
                player_name: currentUser.userName,
                status: status,
                updated_at: new Date().toISOString()
            }], { onConflict: 'schedule_id,player_name' });
            alert(`已登記為：${status}`);
            loadScheduleTab();
        }

        function openEventModal() {
            document.getElementById('eventModal').classList.remove('hidden');
            document.getElementById('eventModal').classList.add('flex');
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.add('hidden');
            document.getElementById('eventModal').classList.remove('flex');
        }

        async function saveScheduleEventFinal() {
            const date = document.getElementById('evDate').value;
            const time = document.getElementById('evTime').value;
            const type = document.getElementById('evType').value;
            const title = document.getElementById('evTitle').value;
            const location = document.getElementById('evLocation').value;

            if (!date || !title) { alert("請填寫活動日期與標題！"); return; }

            const { error } = await sb.from('schedules').insert([{
                event_date: date, event_time: time, event_type: type, title, location
            }]);

            if (!error) {
                alert("🎉 戰役行程發布成功！");
                closeEventModal();
                loadScheduleTab();
            }
        }

        async function loadAssignmentsTab() {
            const container = document.getElementById('tabContentContainer');
            container.innerHTML = `<div class="glass-card rounded-2xl p-5 space-y-4"><h3 class="font-bold text-orange-400">課表中心</h3></div>`;
        }

        async function loadDailyStatusTab() {
            const container = document.getElementById('tabContentContainer');
            container.innerHTML = `<div class="glass-card rounded-2xl p-5 space-y-4"><h3 class="font-bold text-orange-400">每日晨報點檢</h3></div>`;
        }
    </script>
</body>
</html>
