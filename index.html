    <!-- JavaScript 核心 -->
    <script>
        const SUPABASE_URL = "https://ldsedanswynbzymyfwox.supabase.co";
        const SUPABASE_KEY = "sb_publishable_M1akQ21ePT5OVjpjO1kc8A_2GqObjrT";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = { actualRole: null, role: null, userName: null, roleText: null, childName: null, status: null };
        let currentActiveTab = 'overview';
        let activeAttendanceScheduleId = null;
        let bossSelectedFilterRole = 'ALL';

        window.addEventListener("DOMContentLoaded", () => {
            const todayStr = new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', weekday: 'short' });
            document.getElementById('currentDateBadge').innerText = todayStr;
            initializeLiff();
        });

        function initializeLiff() {
            if (typeof liff === 'undefined') return;
            liff.init({ liffId: "2011574321-QGPq8PoR" }).then(() => {
                if (liff.isLoggedIn()) {
                    const profile = liff.getDecodedIDToken();
                    if (profile && profile.sub) autoLoginWithLine(profile.sub, profile.name);
                }
            }).catch(err => console.log("LIFF Error:", err));
        }

        async function autoLoginWithLine(lineUserId, lineName = "") {
            try {
                const { data } = await sb.from('users').select('*').eq('line_id', lineUserId).maybeSingle();
                if (data) processLoginSuccess(data);
            } catch (e) { console.log(e); }
        }

        async function handleLineLogin() {
            if (typeof liff !== 'undefined' && liff.isInClient()) {
                if (!liff.isLoggedIn()) { liff.login(); return; }
                const profile = liff.getDecodedIDToken();
                if (profile && profile.sub) autoLoginWithLine(profile.sub, profile.name);
            } else {
                alert("請直接在下方輸入姓名登入測試！");
            }
        }

        async function handleManualLogin() {
            const acc = document.getElementById('loginAccount').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            if (!acc) { alert("請輸入姓名！"); return; }

            const { data, error } = await sb.from('users').select('*').eq('name', acc).maybeSingle();
            if (error) { alert("連線異常：" + error.message); return; }

            if (!data) {
                alert(`查無【${acc}】的資料！`);
            } else {
                if (data.password && pass && data.password !== pass) {
                    alert("密碼不正確！");
                    return;
                }
                processLoginSuccess(data);
            }
        }

        function processLoginSuccess(userRecord) {
            const isBoss = userRecord.name === "吳俊璋" || userRecord.role.indexOf("BOSS") !== -1;
            let roleCode = "PLAYER";

        function calculateRadarPolygon(values, maxVal = 100, center = 60, maxRadius = 45) {
            const angles = [-90, -30, 30, 90, 150, 210];
            return values.map((val, idx) => {
                const angleRad = (angles[idx] * Math.PI) / 180;
                const r = (Math.max(12, Math.min(val, maxVal)) / maxVal) * maxRadius;
                return {
                    x: (center + r * Math.cos(angleRad)).toFixed(1),
                    y: (center + r * Math.sin(angleRad)).toFixed(1)
                };
            });
        }

            document.getElementById('bossEditRole').value = u.role;
            document.getElementById('bossEditTeam').value = u.team || '大隊';
            document.getElementById('bossEditStatus').value = u.status || '已核准';
            document.getElementById('bossEditPassword').value = '';
            document.getElementById('bossEditChildName').value = u.child_name || '';

            document.getElementById('bossEditUserModal').classList.remove('hidden');

        async function saveBossEditUserFinal() {
            const userId = document.getElementById('bossTargetUserId').value;
            const originalName = document.getElementById('bossTargetOriginalName').value;
            const name = document.getElementById('bossEditName').value.trim();
            const phone = document.getElementById('bossEditPhone').value.trim();
            const role = document.getElementById('bossEditRole').value;
            const team = document.getElementById('bossEditTeam').value;
            const status = document.getElementById('bossEditStatus').value;
            const pass = document.getElementById('bossEditPassword').value.trim();
            const child = document.getElementById('bossEditChildName').value.trim();

            if (!name) { alert("姓名不可為空！"); return; }
            const payload = { name, phone, role, team, status, child_name: child || null };
            if (pass) payload.password = pass;

            await sb.from('users').update(payload).eq('id', userId);
            if (originalName !== name) {
                await sb.from('players').update({ name, team }).eq('name', originalName);
                await sb.from('daily_checkins').update({ player_name: name }).eq('player_name', originalName);
            }
            alert(`已更新【${name}】資料！`);
            closeBossEditUserModal();
            loadDashboardOverview();
        }

        function previewAndCompressImage(fileInput, previewElemId, hiddenInputId) {
            const file = fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 400;
                    let w = img.width, h = img.height;
                    if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
                    else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.88);
                    document.getElementById(hiddenInputId).value = compressedBase64;
                    document.getElementById(previewElemId).innerHTML = `<img src="${compressedBase64}" class="w-full h-full object-cover">`;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
